<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0c0c0c" />
  <title>LIFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="gym-core.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0c0c0c; overflow: hidden; }
    #root { height: 100%; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  

        :root {
            --bg: #0c0c0c;
            --surface: #111111;
            --border: #1a1a1a;
            --text: #e0e0e0;
            --muted: #555555;
            --accent: #f97316;
            --accent-light: rgba(249, 115, 22, 0.1);
            --success: #22c55e;
            --success-light: rgba(34, 197, 94, 0.1);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.1);
            --skip: #444444;
            --skip-light: #161616;
            --push: #f97316;
            --pull: #c084fc;
            --mono: 'DM Mono', monospace;
            --sans: 'DM Sans', sans-serif;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 80px;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        

        .header-left p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 1px;
            font-family: var(--mono);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .workout-badge {
            font-family: var(--mono);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .badge-push {
            background: rgba(249, 115, 22, 0.1);
            color: var(--push);
            border: 1px solid rgba(249, 115, 22, 0.2);
        }

        .badge-pull {
            background: rgba(192, 132, 252, 0.1);
            color: var(--pull);
            border: 1px solid rgba(192, 132, 252, 0.2);
        }

        .settings-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 16px;
            cursor: pointer;
            color: var(--muted);
        }

        .header-select {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            font-family: var(--mono);
            color: var(--text);
            outline: none;
            cursor: pointer;
        }

        .main {
            padding: 16px 16px 0;
            max-width: 480px;
            margin: 0 auto;
        }

        .info-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .info-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
        }

        .info-item .label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: var(--mono);
        }

        .info-item .value {
            font-size: 18px;
            font-weight: 600;
            margin-top: 2px;
            font-family: var(--mono);
            color: var(--accent);
        }

        .section-label {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            padding-left: 2px;
        }

        .exercise-card {
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .exercise-card.done {
            opacity: 0.6;
            border-color: var(--success);
        }

        .exercise-card.skipped {
            opacity: 0.5;
            border-color: var(--skip);
        }

        .exercise-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .exercise-header:active {
            background: var(--bg);
        }

        .exercise-info {
            flex: 1;
        }

        .exercise-category {
            font-size: 10px;
            font-family: var(--mono);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .exercise-name {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.2px;
        }

        .exercise-max {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--muted);
            margin-top: 3px;
        }

        .exercise-max span {
            color: var(--accent);
            font-weight: 500;
        }

        .exercise-status {
            font-size: 18px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .expand-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            transition: transform 0.2s;
            flex-shrink: 0;
            margin-left: 4px;
        }

        .exercise-card.open .expand-icon {
            transform: rotate(180deg);
        }

        .set-logger {
            display: none;
            border-top: 1px solid var(--border);
            padding: 14px 16px;
            background: var(--bg);
        }

        .exercise-card.open .set-logger {
            display: block;
        }

        .sets-list {
            margin-bottom: 12px;
        }

                .person-block {
            background: #0e0e0e;
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .person-label {
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-family: var(--mono);
        }

        .set-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .set-num {
            display: none;
        }

        .set-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .set-input {
            background: #0c0c0c;
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 8px;
            width: 70px;
            text-align: center;
            font-size: 16px;
            font-family: var(--mono);
            color: var(--text);
            outline: none;
        }

        .set-input:focus {
            border-color: var(--accent);
            background: #161616;
        }

        .set-input::placeholder {
            color: var(--muted);
            font-size: 11px;
        }

        .set-separator {
            font-size: 12px;
            color: var(--muted);
            font-family: var(--mono);
        }

        .set-log-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-family: var(--sans);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.15s;
        }

        .set-log-btn:active {
            opacity: 0.8;
        }

        .set-log-btn.logged {
            background: var(--success-light);
            color: var(--success);
        }

        .rep-range-hint {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--muted);
            text-align: center;
            margin-bottom: 10px;
        }

        .rep-range-hint strong {
            color: var(--accent);
        }

        

        .exercise-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        

        .skip-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .mark-done-btn:active,
        .skip-btn:active {
            opacity: 0.7;
        }

        .complete-btn {
            width: 100%;
            background: rgba(249, 115, 22, 0.1);
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            padding: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .complete-btn:active {
            opacity: 0.85;
        }

        .complete-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .got-more-btn {
            width: 100%;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent-light);
            border-radius: var(--radius);
            padding: 14px;
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.15s;
        }

        .got-more-btn:active {
            background: var(--accent-light);
        }

        .more-time-btn {
            width: 100%;
            background: rgba(249, 115, 22, 0.05);
            color: var(--accent);
            border: 1px dashed var(--accent);
            border-radius: var(--radius);
            padding: 12px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }

        .more-time-btn:active {
            background: var(--bg);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 13px;
        }

        .loading-dot {
            display: inline-block;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {

            0%,
            80%,
            100% {
                opacity: 0.3;
            }

            40% {
                opacity: 1;
            }
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: #DC2626;
            font-size: 13px;
        }

        .success-state {
            text-align: center;
            padding: 60px 20px;
        }

        .success-state .check {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .success-state h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .success-state p {
            color: var(--muted);
            font-size: 14px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .modal h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
            letter-spacing: 1px;
        }
        .modal-label {
            font-size: 10px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-family: var(--mono);
        }
        .modal-input {
            width: 100%;
            background: #0c0c0c;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 13px;
            margin-bottom: 20px;
            outline: none;
        }
        .modal-input:focus { border-color: var(--accent); }

        

        .modal-save-btn {
            width: 100%;
            background: var(--text);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 14px;
            font-family: var(--sans);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .modal-cancel-btn {
            width: 100%;
            background: transparent;
            color: var(--muted);
            border: none;
            padding: 10px;
            font-family: var(--sans);
            font-size: 14px;
            cursor: pointer;
        }

        .config-screen {
            padding: 40px 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        .config-screen h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.4px;
        }

        .config-screen p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .config-label {
            font-size: 12px;
            font-family: var(--mono);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .config-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text);
            outline: none;
            margin-bottom: 20px;
        }

        .config-input:focus {
            border-color: var(--accent);
        }

        .config-btn {
            width: 100%;
            background: var(--text);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 14px;
            font-family: var(--sans);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .config-note {
            font-size: 11px;
            color: var(--muted);
            margin-top: 12px;
            text-align: center;
            font-family: var(--mono);
        }
    
</style>
</head>

<body>
    <style>
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #0c0c0c;
      border-top: 1px solid #1a1a1a;
      display: flex;
      z-index: 1000;
    }
    .nav-btn {
      flex: 1;
      padding: 16px;
      background: transparent;
      color: #555;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .nav-btn.active {
      color: #f97316;
      border-top: 2px solid #f97316;
      background: #111;
    }
    #tracker-root, #builder-root {
      height: 100%;
      padding-bottom: 60px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    #tracker-root { display: block; }
    #builder-root { display: none; }
  </style>
  <!-- UNIFIED SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal" onclick="closeSettings(event)">
        <div class="modal" style="max-width:340px; max-height:85vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="margin:0; color:var(--accent); letter-spacing:1px;">SETTINGS</h3>
                <button onclick="closeSettingsModal()" style="background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;">✕</button>
            </div>

            <div class="modal-label">Apps Script URL</div>
            <input type="text" class="modal-input" id="settingsUrlInput" placeholder="https://script.google.com/macros/s/..." style="font-size:11px;" />

            <div class="modal-label" style="margin-top:20px;">ROSTER (Who is working out today?)</div>
            <div id="activePeopleCheckboxes" style="margin-bottom:12px;"></div>
            
            <div style="display:flex; gap:8px; margin-bottom:20px;">
                <input type="text" id="newPersonInput" placeholder="Add person..." style="flex:1; padding:8px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:12px;" />
                <button onclick="addNewPerson()" style="background:var(--accent); color:black; border:none; padding:0 12px; border-radius:6px; font-weight:700; font-size:11px;">ADD</button>
            </div>

            <div class="modal-label">LOCATIONS</div>
            <div id="locationsList" style="margin-bottom:12px;"></div>
            <div style="display:flex; gap:8px; margin-bottom:20px;">
                <input type="text" id="newLocationInput" placeholder="Add location..." style="flex:1; padding:8px; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:12px;" />
                <button onclick="addNewLocation()" style="background:var(--accent); color:black; border:none; padding:0 12px; border-radius:6px; font-weight:700; font-size:11px;">ADD</button>
            </div>

            <div id="deviceOwnerContainer" style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);"></div>

            <div style="margin-top:24px; display:flex; flex-direction:column; gap:8px;">
                <button class="modal-save-btn" onclick="saveSettings()" style="width:100%; margin:0;">Save & Sync Everything</button>
                <button onclick="manualSyncFromSettings()" style="background:none; border:1px solid var(--success); color:var(--success); padding:10px; border-radius:8px; font-size:11px; font-family:var(--mono); cursor:pointer;">↑ Sync Roster to Sheets</button>
            </div>
        </div>
    </div>

  <div id="tracker-root"></div>
  
  <div id="builder-root">

    <div class="header">
        <div class="header-left">
            <h1>PLAN</h1>
            <p id="headerSub">Loading...</p>
        </div>
        <div class="header-right">
            <select id="locationSelect" class="header-select" onchange="changeLocation()" style="display:none;"></select>
            <button id="workoutBadge" class="workout-badge" onclick="togglePushPull()" style="cursor: pointer; border: none;"></button>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <div class="main">
        <div id="loadingState" class="loading">
            <span class="loading-dot">●</span>
            <span class="loading-dot">●</span>
            <span class="loading-dot">●</span>
        </div>

        <div id="errorState" class="error-state" style="display:none;"></div>

        <div id="successState" class="success-state" style="display:none;">
            <div class="check">✓</div>
            <h2>Workout Complete!</h2>
            <p>Great work. Come back for your next session.</p>
        </div>

        <div id="workoutContent" style="display:none;">
            <div class="info-bar">
                <div class="info-item">
                    <div class="label">Workout</div>
                    <div class="value" id="infoWorkoutNum">—</div>
                </div>
                <div class="info-item">
                    <div class="label">Reps</div>
                    <div class="value" id="infoRepRange">—</div>
                </div>
                <div class="info-item">
                    <div class="label">Sets</div>
                    <div class="value">3</div>
                </div>
            </div>

            <div class="section-label">Exercises</div>
            <div id="exerciseList"></div>

            <button class="complete-btn" id="completeBtn" onclick="completeWorkout()">
                Complete Workout
            </button>

            <button class="got-more-btn" id="gotMoreBtn" onclick="getAccessory()" style="display:none;">
                + Got more time? Suggest an accessory
            </button>

            <div id="accessorySection" style="display:none; margin-top: 16px;">
                <div class="section-label">Accessory — Optional</div>
                <div class="exercise-card" id="accessoryCard">
                    <div class="exercise-header" onclick="toggleAccessory()">
                        <div class="exercise-info">
                            <div class="exercise-category">Accessory</div>
                            <div class="exercise-name" id="accessoryName">—</div>
                            <div class="exercise-max" id="accessoryMax"></div>
                        </div>
                        <div class="expand-icon">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                    </div>
                    <div class="set-logger" id="accessoryLogger" style="display:none;">
                        <div class="rep-range-hint">Target: <strong id="accessoryRepRange">—</strong> reps</div>
                        <div class="sets-list" id="accSetsList"></div>
                        <button class="complete-btn" style="padding:12px; margin-top:8px; margin-bottom:12px; font-size:14px;" id="acc-logbtn" onclick="logAccessorySet()">Log Set 1</button>
                        <div class="new-max-banner" id="acc-maxbanner"></div>
                        <div class="exercise-actions">
                            <button class="mark-done-btn" onclick="markAccessoryDone()">✓ Mark Done</button>
                        </div>
                    </div>
                </div>
                <button class="more-time-btn" id="suggestDiffBtn" onclick="getAccessory()">↺ Suggest Different Exercise</button>
            </div>
        </div>
    </div>
  </div>

  <div class="bottom-nav">
     <button id="nav-tracker" class="nav-btn active" onclick="switchView('tracker')">LIFT</button>
     <button id="nav-builder" class="nav-btn" onclick="switchView('builder')">PLAN</button>
  </div>

  <script>
    function switchView(view) {
       document.getElementById('tracker-root').style.display = view === 'tracker' ? 'block' : 'none';
       document.getElementById('builder-root').style.display = view === 'builder' ? 'block' : 'none';
       document.getElementById('nav-tracker').classList.toggle('active', view === 'tracker');
       document.getElementById('nav-builder').classList.toggle('active', view === 'builder');
       
       if(view === 'builder' && typeof initBuilder === 'function') {

let exerciseStatus = {};

            const input = document.getElementById('newPersonInput');
            const name = input.value.trim();
            if (!name) return;
            const all = JSON.parse(localStorage.getItem(PEOPLE_KEY)) || DEFAULT_PEOPLE;
            if (all.includes(name)) return alert("Already exists");
            const next = [...all, name];
            localStorage.setItem(PEOPLE_KEY, JSON.stringify(next));
            input.value = '';
            openSettings();
        }

        function removePersonGlobal(name) {
            if (!confirm(`Remove ${name} from all devices?`)) return;
            const all = JSON.parse(localStorage.getItem(PEOPLE_KEY)) || DEFAULT_PEOPLE;
            const next = all.filter(p => p !== name);
            localStorage.setItem(PEOPLE_KEY, JSON.stringify(next));
            openSettings();
        }

        function addNewLocation() {
            const input = document.getElementById('newLocationInput');
            const name = input.value.trim();
            if (!name) return;
            const all = JSON.parse(localStorage.getItem(LOCATIONS_KEY)) || DEFAULT_LOCATIONS;
            if (all.includes(name)) return alert("Already exists");
            const next = [...all, name];
            localStorage.setItem(LOCATIONS_KEY, JSON.stringify(next));
            input.value = '';
            openSettings();
        }

        function removeLocationGlobal(name) {
            const all = JSON.parse(localStorage.getItem(LOCATIONS_KEY)) || DEFAULT_LOCATIONS;
            const next = all.filter(l => l !== name);
            localStorage.setItem(LOCATIONS_KEY, JSON.stringify(next));

        async function manualSyncFromSettings() {
            const btn = event.currentTarget;
            btn.textContent = "Syncing...";
            try {
                const people = JSON.parse(localStorage.getItem(PEOPLE_KEY)) || DEFAULT_PEOPLE;
                await sheetsPost({ action: "savePeople", people });
                btn.textContent = "Synced ✓";
                setTimeout(() => btn.textContent = "↑ Sync Roster to Sheets", 2000);
            } catch(e) {
                alert("Sync failed");
                btn.textContent = "Retry Sync";
            }
        }

        function saveSettings() {
            const url = document.getElementById('settingsUrlInput').value.trim();
            if (url) localStorage.setItem('gym_api_url', url);
            
            const oldOwner = localStorage.getItem('builder_primary_user') || 'Brian';
            const oldLeader = (activePeople.includes(oldOwner) ? oldOwner : (activePeople[0] || 'Brian')).toLowerCase();
            
            const cbs = document.querySelectorAll('.person-cb');
            let hidden = [];
            let selected = [];
            
            const allPeople = JSON.parse(localStorage.getItem(PEOPLE_KEY)) || DEFAULT_PEOPLE;
            cbs.forEach(cb => { 
                if (cb.checked) selected.push(cb.value); 
                else hidden.push(cb.value);
            });
            
            const newPrimary = document.getElementById('deviceOwnerSelect').value;
            
            if (selected.length === 0) {
                selected = [newPrimary];
                hidden = hidden.filter(h => h !== selected[0]);
            }
            
            activePeople = selected;
            localStorage.setItem(HIDDEN_PEOPLE_KEY, JSON.stringify(hidden));
            localStorage.setItem(ACTIVE_PEOPLE_KEY, JSON.stringify(selected));
            localStorage.setItem('builder_primary_user', newPrimary);
            
            // Sync Meta to Sheets (Background)
            const people = JSON.parse(localStorage.getItem(PEOPLE_KEY)) || DEFAULT_PEOPLE;
            const locations = JSON.parse(localStorage.getItem(LOCATIONS_KEY)) || DEFAULT_LOCATIONS;
            sheetsPost({ action: "syncMeta", people, locations, exercises: [] }).catch(() => {});

            notifySettingsUpdated();
            closeSettingsModal();
            
            const newLeader = (activePeople.includes(newPrimary) ? newPrimary : (activePeople[0] || 'Brian')).toLowerCase();
            if (oldLeader !== newLeader) {
                loadDataAndWorkout();
            } else if (currentWorkout) {
                renderWorkout(currentWorkout, currentWorkout.exercises);
            }
        }

        function closeSettingsModal() { document.getElementById('settingsModal').classList.remove('open'); }
        function closeSettings(e) { if (e.target === document.getElementById('settingsModal')) closeSettingsModal(); }

        async function loadDataAndWorkout(preFetchedData = null) {
            showLoading();
            try {
                // If we have pre-fetched data (from the React Master Sync), use it.
                // Otherwise, fetch it ourselves (fallback).
                const json = preFetchedData || await sheetsGet();
                globalData = json;
                
                // SYNC WORKOUT NUMBER AND TYPE FROM SPREADSHEET
                if (globalData.settings) {
                    const owner = localStorage.getItem('builder_primary_user') || 'Brian';
                    const primaryUser = (activePeople.includes(owner) ? owner : (activePeople[0] || 'Brian')).toLowerCase();
                    const cloudNum = parseInt(globalData.settings[`builder_workout_num_${primaryUser}`] || '0');
                    const cloudType = globalData.settings[`builder_workout_type_${primaryUser}`] || '';
                    
                    const localNum = parseInt(localStorage.getItem(NUM_KEY) || '0');
                    const localType = localStorage.getItem(TYPE_KEY) || '';
                    
                    // 1. Sync Workout Number
                    if (cloudNum > 0) {
                        if (cloudNum !== localNum) {
                            console.log(`Cloud sync (Num) for ${primaryUser}: ${localNum} -> ${cloudNum}`);
                            localStorage.setItem(NUM_KEY, cloudNum.toString());
                        }
                    } else {
                        // Cloud is empty for this user: FORCE start at 0 (Workout #1)
                        // This prevents "Leaking" from the previous user on this device
                        console.log(`New user detected or empty cloud (${primaryUser}): Resetting local storage to 0`);
                        localStorage.setItem(NUM_KEY, '0');
                    }

                    // 2. Sync Workout Type (Push/Pull)
                    if (cloudType && cloudType !== localType) {
                        console.log(`Cloud sync (Type) for ${primaryUser}: ${localType} -> ${cloudType}`);
                        localStorage.setItem(TYPE_KEY, cloudType);
                    }
                }
                
                try {
                    const hidden = JSON.parse(localStorage.getItem(HIDDEN_PEOPLE_KEY)) || [];
                    const all = globalData.people || ['Brian'];
                    const visible = all.filter(p => !hidden.includes(p));
                    if (visible.length > 0) activePeople = visible;
                    else activePeople = [all[0]];
                } catch {
                    activePeople = [(globalData.people || ['Brian'])[0]];
                }
                
                setupSelectors();
                generateWorkout();
            } catch (err) {
                showError('Could not connect to your sheet. Check your URL in settings.');
                console.error(err);
            }
        }

        // Global hook for the React "Master Sync" to push data into the Plan side
        window.updatePlanData = (data) => {
            if (typeof loadDataAndWorkout === 'function') {
                loadDataAndWorkout(data);
            }
        };

        function setupSelectors() {
            const locSelect = document.getElementById('locationSelect');
            const locOptions = ['Anywhere', ...(globalData.locations || [])].filter((v,i,a)=>a.indexOf(v)===i);
            locSelect.innerHTML = locOptions.map(l => `<option value="${l}">${l}</option>`).join('');
            
            // Check global active location first
            const savedLoc = localStorage.getItem(ACTIVE_LOCATION_KEY) || localStorage.getItem(LOC_KEY) || 'Anywhere';
            if(locOptions.includes(savedLoc)) locSelect.value = savedLoc;
            locSelect.style.display = 'inline-block';
        }

        function changeLocation() {
            const val = document.getElementById('locationSelect').value;
            localStorage.setItem(LOC_KEY, val);
            localStorage.setItem(ACTIVE_LOCATION_KEY, val);
            notifySettingsUpdated();
            generateWorkout();
        }

        function togglePushPull() {
            if(!currentWorkout || !currentWorkout.type) return;
            const newType = currentWorkout.type.toLowerCase() === 'push' ? 'Pull' : 'Push';
            
            // Save to both legacy and global keys
            localStorage.setItem(TYPE_KEY, currentWorkout.type.toLowerCase() === 'push' ? 'Push' : 'Pull');
            localStorage.setItem(ACTIVE_TYPE_KEY, newType);
            
            notifySettingsUpdated();
            generateWorkout();
        }

        function getRepRange(workoutNum) {
             const position = ((workoutNum - 1) % 16);
             if (position < 4)  return "8-12";
             if (position < 8)  return "1-3";
             if (position < 12) return "13+"; // Normalized from 15-20
             return "4-7";
        }

        function getRangeKeyFromLabel(label) {
             if (label === "1-3") return "r1_3";
             if (label === "4-7") return "r4_7";
             if (label === "8-12") return "r8_12";
             return "r13_plus";
        }

        const getBaseName = (name) => {
            if (!name) return "";
            return name
                .replace(/^(One Arm |One Leg |Single-leg |Single Leg |Single )/i, '')
                .replace(/ \(Single\)$/i, '')
                .replace(/ \(Alt\)$/i, '')
                .replace(/ \(Alternating\)$/i, '')
                .trim();
        };

        const getMode = (name) => {
            if (!name) return "std";
            if (/single|one arm|one leg/i.test(name)) return 'single';
            if (/alt/i.test(name)) return 'alt';
            return 'std';
        };

        const getStandardizedName = (name) => {
            const base = getBaseName(name);
            const mode = getMode(name);
            if (mode === 'single') return `${base} (Single)`;
            if (mode === 'alt')    return `${base} (Alt)`;
            return base;
        };

        function generateWorkout() {
             const loc = document.getElementById('locationSelect').value;
             
             // Check global type first
             let lastTypeGlobal = localStorage.getItem(ACTIVE_TYPE_KEY);
             let type;
             if (lastTypeGlobal) {
                 type = lastTypeGlobal;
             } else {
                 let lastType = localStorage.getItem(TYPE_KEY) || 'Pull';
                 type = lastType.toLowerCase() === 'push' ? 'Pull' : 'Push';
             }
             
             let num = parseInt(localStorage.getItem(NUM_KEY) || '0') + 1;
             const activeRange = getRepRange(num);
             const rangeKey = getRangeKeyFromLabel(activeRange);
             
             const available = (globalData.exercises || []).filter(e => !e.timed && (e.location === 'Anywhere' || e.location === loc || !e.location));
             
             const pick = (categories) => {
                 const subset = available.filter(e => categories.includes(e.category));
                 if(subset.length === 0) return {name: `No ${categories[0]}`, category: categories[0]};
                 
                 // Group by base name so variations don't inflate pick chance
                 const groups = {};
                 subset.forEach(e => {
                     const base = getBaseName(e.name);
                     if (!groups[base]) groups[base] = [];
                     groups[base].push(e);
                 });
                 
                 const baseNames = Object.keys(groups);
                 const pickedBase = baseNames[Math.floor(Math.random() * baseNames.length)];
                 const variations = groups[pickedBase];
                 
                 // Default to 'std' if exists, else first available
                 return variations.find(v => getMode(v.name) === 'std') || variations[0];
             };
             
             const genExercises = type === 'Push' ? [
                 pick(['Explosive']),
                 pick(['Knee Dominant']),
                 pick(['Vertical Push']),
                 pick(['Horizontal Push']),
                 pick(['Rotational Core', 'Plank Core']),
             ] : [
                 pick(['Explosive']),
                 pick(['Hip Dominant']),
                 pick(['Vertical Pull']),
                 pick(['Horizontal Pull']),
                 pick(['Plank Core', 'Rotational Core']),
             ];
             
             currentWorkout = {
                 type: type,
                 workoutNum: num,
                 repRange: activeRange, 
                 exercises: genExercises
             };
             
             exerciseStatus = {};
             exerciseSetCounters = {};
             exerciseModes = {};

             genExercises.forEach((e, idx) => { 
                 exerciseStatus[e.name] = 'pending'; 
                 exerciseSetCounters[idx] = 1;
                 exerciseModes[idx] = getMode(e.name);
             });
             
             currentMaxes = {};
             genExercises.forEach(e => {
                 const stdName = getStandardizedName(e.name);
                 currentMaxes[stdName] = {};
                 activePeople.forEach(p => {
                     currentMaxes[stdName][p] = globalData.best?.[stdName]?.[p.toLowerCase()] || {};
                 });
             });
             
             renderWorkout(currentWorkout, genExercises);
        }

        function showSwap(idx) {
            document.getElementById(`logger-${idx}`).style.display = 'none';
            document.getElementById(`swap-ui-${idx}`).style.display = 'block';
            document.getElementById(`swap-select-${idx}`).value = 'custom';
            checkCustom(idx);
        }
        
        function hideSwap(idx) {
            document.getElementById(`logger-${idx}`).style.display = 'block';
            document.getElementById(`swap-ui-${idx}`).style.display = 'none';
        }
        
        function checkCustom(idx) {
            const val = document.getElementById(`swap-select-${idx}`).value;
            const customBlock = document.getElementById(`swap-custom-block-${idx}`);
            if (val === 'custom') customBlock.style.display = 'block';
            else customBlock.style.display = 'none';
        }
        
        async function confirmSwap(idx) {
            const btn = document.getElementById(`confirm-swap-btn-${idx}`);
            const selectVal = document.getElementById(`swap-select-${idx}`).value;
            let newName = '';
            let newCat = currentWorkout.exercises[idx].category;
            
            if (selectVal === 'custom') {
                const typed = document.getElementById(`swap-custom-${idx}`).value.trim();
                let selectedLoc = document.getElementById(`swap-loc-${idx}`).value;
                const createSingle = document.getElementById(`swap-single-${idx}`).checked;
                const createAlt = document.getElementById(`swap-alt-${idx}`).checked;

                if (!typed) { alert('Please enter a custom machine name.'); return; }
                
                newName = typed;
                btn.textContent = 'Saving...';
                btn.disabled = true;
                
                const namesToCreate = [newName];
                if (createSingle) namesToCreate.push(`${newName} (Single)`);
                if (createAlt)    namesToCreate.push(`${newName} (Alt)`);

                for (const name of namesToCreate) {
                    const req = {
                       action: "saveExercise",
                       exercise: name,
                       category: newCat,
                       location: selectedLoc,
                       timed: false
                    };
                    try {
                        await sheetsPost(req);
                        globalData.exercises.push({ name, category: newCat, location: selectedLoc, timed: false });
                    } catch(e) { console.error(e); }
                }
                
                btn.textContent = 'Confirm';
                btn.disabled = false;
                
            } else {
                newName = selectVal;
                const found = globalData.exercises.find(e => e.name === newName);
                if(found) newCat = found.category;
            }
            
            const oldName = currentWorkout.exercises[idx].name;
            currentWorkout.exercises[idx] = { name: newName, category: newCat };
            
            delete exerciseStatus[oldName];
            exerciseStatus[newName] = 'pending';
            exerciseSetCounters[idx] = 1;
            exerciseModes[idx] = getMode(newName);

            const stdName = getStandardizedName(newName);
            currentMaxes[stdName] = {};
            activePeople.forEach(p => {
                 currentMaxes[stdName][p] = globalData.best?.[stdName]?.[p.toLowerCase()] || {};
            });
            
            renderWorkout(currentWorkout, currentWorkout.exercises);
            toggleCard(idx);
        }

        function switchVariation(idx, mode) {
            const currentEx = currentWorkout.exercises[idx];
            const base = getBaseName(currentEx.name);
            let targetName = base;
            if (mode === 'single') targetName = `${base} (Single)`;
            if (mode === 'alt')    targetName = `${base} (Alt)`;
            
            const found = globalData.exercises.find(e => e.name === targetName);
            if (!found) return;

            // Update state
            exerciseModes[idx] = mode;
            const oldName = currentEx.name;
            currentWorkout.exercises[idx] = found;
            
            if (exerciseStatus[oldName]) {
                exerciseStatus[found.name] = exerciseStatus[oldName];
                delete exerciseStatus[oldName];
            }
            
            const stdName = getStandardizedName(found.name);
            if (!currentMaxes[stdName]) {
                currentMaxes[stdName] = {};
                activePeople.forEach(p => {
                    currentMaxes[stdName][p] = globalData.best?.[stdName]?.[p.toLowerCase()] || {};
                });
            }

            renderWorkout(currentWorkout, currentWorkout.exercises);
            toggleCard(idx);
        }

        async function addVariation(idx, mode) {
            const currentEx = currentWorkout.exercises[idx];
            const base = getBaseName(currentEx.name);
            const targetName = mode === 'single' ? `${base} (Single)` : `${base} (Alt)`;
            
            if (!confirm(`Create "${targetName}" variation?`)) return;

            const req = {
               action: "saveExercise",
               exercise: targetName,
               category: currentEx.category,
               location: currentEx.location || "Anywhere",
               timed: false
            };
            
            try {
                await sheetsPost(req);
                const newEx = {
                    name: targetName,
                    category: currentEx.category,
                    location: currentEx.location || "Anywhere",
                    timed: false
                };
                globalData.exercises.push(newEx);
                switchVariation(idx, mode);
            } catch(e) {
                alert("Failed to create variation.");
            }
        }

        function undoStatus(idx, exName) {
            delete exerciseStatus[exName];
            renderWorkout(currentWorkout, currentWorkout.exercises);
        }

        function toggleCard(idx) {
            const card = document.getElementById(`card-${idx}`);
            if (card.classList.contains('done') || card.classList.contains('skipped')) return;
            card.classList.toggle('open');
        }

        function renderHistory(idx, exerciseName) {
            const content = document.getElementById(`history-content-${idx}`);
            const ex = currentWorkout.exercises[idx];
            const history = (globalData.history || []).filter(h => h.exercise === exerciseName);
            
            if (history.length === 0) {
                content.innerHTML = '<div style="padding:10px;text-align:center;color:#444;font-size:12px;">No history found.</div>';
                return;
            }

            let html = '';
            history.slice(-10).reverse().forEach((h, hIdx) => {

                <div style="display:flex; justify-content:space-between; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid #1a1a1a;">
                    <div style="flex:1;">
                        <div style="font-size:10px; color:#666;">${h.date || 'Today'}</div>
                        <div style="font-size:11px; color:var(--accent); font-weight:600;">${h.person?.toUpperCase()}</div>
                        ${h.note ? `<div style="font-size:10px; color:#555; font-style:italic; margin-top:2px;">${h.note}</div>` : ''}
                    </div>
                    <div style="text-align:right; display:flex; align-items:center; gap:8px;">
                        <div>
                            <div style="font-size:12px; font-weight:600; color:#ddd;">
                                ${ex.timed ? `${h.reps}${h.weight ? ` · ${h.weight}lbs` : ""}` : (h.weight ? `${h.reps}x${h.weight}` : `${h.reps} reps`)}
                            </div>
                            <div style="font-size:9px; color:#444; font-family:var(--mono);">${ex.timed ? "⏱" : (h.range ? h.range.replace("r", "").replace("_", "-") : "")}</div>
                        </div>
                    </div>
                </div>`;
            });
            content.innerHTML = html;
        }

        function toggleHistory(e, idx, exerciseName) {
            e.stopPropagation();
            const drawer = document.getElementById(`history-drawer-${idx}`);
            const content = document.getElementById(`history-content-${idx}`);
            
            if (drawer.style.display === 'block') {
                drawer.style.display = 'none';
                return;
            }
            
            drawer.style.display = 'block';
            renderHistory(idx, getStandardizedName(exerciseName));
            
            const history = (globalData.history || []).filter(h => 
                h.exercise && h.exercise.trim().toLowerCase() === exerciseName.trim().toLowerCase() && 
                h.person &&
                activePeople.map(p => p.toLowerCase().trim()).includes(h.person.toLowerCase().trim())
            );
            
            if (history.length === 0) {
                content.innerHTML = '<div style="padding:10px;text-align:center;color:var(--muted);">No history found for active people.</div>';
                return;
            }
            
            let html = '';
            // Get last 10 entries, reversed
            const recent = history.slice(-10).reverse();
            recent.forEach(h => {
                const exData = globalData.exercises.find(ex => ex.name.trim().toLowerCase() === exerciseName.trim().toLowerCase()) || {};
                const isTimed = exData.timed;
                let resultText = '';
                if (isTimed) {
                     resultText = h.reps + (h.weight ? ` · ${h.weight}lbs` : '');
                } else {
                     resultText = h.weight ? `${h.reps}x${h.weight}` : `${h.reps} reps`;
                }
                
                const rangeLabel = isTimed ? '⏱' : (h.range ? h.range.replace('r', '').replace('_', '-') : '');
                
                html += `
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid #1a1a1a;">
                   <div style="flex:1;">
                      <div style="font-size:10px; color:var(--muted);">${h.date || 'Unknown Date'}</div>
                      <div style="font-size:11px; color:var(--accent); font-weight:600;">${h.person.toUpperCase()}</div>
                      ${h.note ? `<div style="font-size:10px; color:var(--muted); font-style:italic; margin-top:2px;">${h.note}</div>` : ''}
                   </div>
                   <div style="text-align:right; display:flex; align-items:center; gap:8px;">
                      <div>
                          <div style="font-size:12px; font-weight:600; color:var(--text);">${resultText}</div>
                          <div style="font-size:9px; color:var(--muted); font-family:var(--mono);">${rangeLabel}</div>
                      </div>
                       <button onclick="deletePlanHistory(event, '${h.date}', '${h.person.toLowerCase()}', '${exerciseName.replace(/'/g, "\\'")}', '${h.reps}', '${h.weight}', '${h.range}', ${idx})" 
                               style="background:none; border:none; color:#ff4444; cursor:pointer; padding:4px; opacity:0.6;" title="Delete Entry">
                           <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                       </button>
                   </div>
                </div>`;
            });
            content.innerHTML = html;
        }

        async function deletePlanHistory(event, date, person, exercise, reps, weight, range, idx) {
            event.stopPropagation();
            if(!confirm(`Delete this entry for ${person.toUpperCase()}?`)) return;
            
            const btn = event.currentTarget;
            btn.style.opacity = '0.3';
            btn.disabled = true;
            
            const payload = {
                action: "deleteHistory",
                exercise: exercise,
                person: person,
                reps: reps.toString(),
                weight: weight.toString(),
                range: range
            };
            
            try {
                const res = await sheetsPost(payload);
                if (res) {
                    // Update global data and refresh list
                    if(globalData.history) {
                        globalData.history = globalData.history.filter(h => 
                            !(h.exercise === exercise && h.person.toLowerCase() === person.toLowerCase() && 
                              h.reps.toString() === reps.toString() && h.weight.toString() === weight.toString() &&
                              h.range === range)
                        );
                    }
                    toggleHistory({ stopPropagation: () => {} }, idx, exercise);
                    
                    // Signal Lift tab to refresh if open
                    if (window.refreshLiftData) window.refreshLiftData();
                }
            } catch(e) {
                alert("Failed to delete entry.");
                btn.style.opacity = '0.6';
                btn.disabled = false;
            }
        }

        function toggleAccessory() {
            const logger = document.getElementById('accessoryLogger');
            const card = document.getElementById('accessoryCard');
            card.classList.toggle('open');
            logger.style.display = card.classList.contains('open') ? 'block' : 'none';
        }

        async function logSet(cardIdx, exerciseName) { const ex = currentWorkout.exercises[cardIdx];
            const setNum = exerciseSetCounters[cardIdx] || 1;
            const btn = document.getElementById(`logbtn-${cardIdx}`);
            btn.textContent = 'Saving...'; 
            btn.disabled = true;

            const entries = [];
            const dateStr = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
            
            let bannerMsg = "";

            for (const p of activePeople) {
                const repsVal = document.getElementById(`reps-${cardIdx}-${p}`).value;
                const weightVal = document.getElementById(`weight-${cardIdx}-${p}`).value;
                if (!repsVal) continue;
                
                const reps = parseInt(repsVal);
                let weightValFixed = weightVal;
                if (ex.timed) {
                    weightValFixed = normalizeDuration(weightVal);
                }
                const weight = parseFloat(weightValFixed) || 0;
                
                const rangeKey = getRange(reps);
                const repRange = REP_RANGES.find(r => r.key === rangeKey)?.label || '—';
                
                entries.push({
                   date: dateStr,
                   person: p.toLowerCase(),
                   reps: reps.toString(),
                   weight: weightValFixed || "",
                   range: rangeKey,
                   note: `Set ${setNum} (Builder #${currentWorkout.workoutNum})`,
                   setNum: setNum,
                   timed: false
                });
                
                const stdExName = getStandardizedName(exerciseName);
                const existing = currentMaxes[stdExName]?.[p]?.[rangeKey];
                let isNew = !existing;
                if (existing) {
                    if (weight > parseFloat(existing.weight)) isNew = true;
                }
                if (isNew) {
                    if(!currentMaxes[stdExName]) currentMaxes[stdExName] = {};
                    if(!currentMaxes[stdExName][p]) currentMaxes[stdExName][p] = {};
                    currentMaxes[stdExName][p][rangeKey] = {reps, weight};
                    const newMaxStr = `${reps}x${weight}`;
                    bannerMsg += `🏆 ${p} New ${repRange} max: ${newMaxStr}<br>`;
                    if (rangeKey === getRangeKeyFromLabel(currentWorkout.repRange)) {
                        const valId = document.getElementById(`maxval-${cardIdx}-${p}`);
                        if(valId) valId.textContent = newMaxStr;
                    }
                }
            }

            if (entries.length === 0) {
                alert('Please enter reps for at least one person.');
                btn.textContent = `Log Set ${setNum}`;
                btn.disabled = false;
                return;
            }

            const req = {
               action: "logSet",
               exercise: getStandardizedName(exerciseName),
               entries: entries
            };
            
            try {
                await sheetsPost(req);
                
                // Update local history for instant feedback
                const entriesWithEx = entries.map(e => ({ ...e, exercise: getStandardizedName(exerciseName) }));
                if (!globalData.history) globalData.history = [];
                globalData.history.push(...entriesWithEx);
                
                // If history drawer is open, refresh it
                const drawer = document.getElementById(`history-drawer-${cardIdx}`);
                if (drawer && drawer.style.display === 'block') {
                    renderHistory(cardIdx, getStandardizedName(exerciseName));
                }
                
                if (bannerMsg) {
                    const banner = document.getElementById(`maxbanner-${cardIdx}`);
                    if (banner) { banner.style.display = 'block'; banner.innerHTML = bannerMsg; }
                }
                
                activePeople.forEach(p => {
                    const rEl = document.getElementById(`reps-${cardIdx}-${p}`);
                    const wEl = document.getElementById(`weight-${cardIdx}-${p}`);
                    if (rEl) rEl.value = '';
                    if (wEl) wEl.value = '';
                });
                
                exerciseSetCounters[cardIdx] = setNum + 1;
                btn.textContent = `Log Set ${exerciseSetCounters[cardIdx]}`;
                btn.disabled = false;
                
            } catch(e) {
                console.error(e);
                alert('Failed to log set. Check console.');
                btn.textContent = `Log Set ${setNum}`;
                btn.disabled = false;
            }
        }

        function markDone(idx, exerciseName) {
            exerciseStatus[exerciseName] = 'done';
            const card = document.getElementById(`card-${idx}`);
            card.classList.remove('open');
            card.classList.add('done');
            exerciseStatus[exerciseName] = 'done'; renderWorkout(currentWorkout, currentWorkout.exercises);
            checkAllComplete();
        }

        function skipExercise(idx, exerciseName) {
            exerciseStatus[exerciseName] = 'skipped';
            const card = document.getElementById(`card-${idx}`);
            card.classList.remove('open');
            card.classList.add('skipped');
            exerciseStatus[exerciseName] = 'skipped'; renderWorkout(currentWorkout, currentWorkout.exercises);
            checkAllComplete();
        }

        function checkAllComplete() {
            const allResolved = Object.values(exerciseStatus).every(s => s === 'done' || s === 'skipped');
            if (allResolved) document.getElementById('gotMoreBtn').style.display = 'block';
        }

        async function completeWorkout() {
            const num = currentWorkout.workoutNum.toString();
            const type = currentWorkout.type;
            localStorage.setItem(TYPE_KEY, type);
            localStorage.setItem(NUM_KEY, num);
            
            // SYNC TO SPREADSHEET (Smart Finish for all active people)
            try {
                const settings = {};
                activePeople.forEach(p => {
                    const name = p.toLowerCase();
                    settings[`builder_workout_num_${name}`] = num;
                    settings[`builder_workout_type_${name}`] = type;
                });
                // Fallback/Legacy global key
                settings["builder_workout_num"] = num;
                settings["builder_workout_type"] = type;

                // Background sync (don't wait for it)
                sheetsPost({
                    action: "saveSettings",
                    settings: settings
                }).catch(e => console.warn("Background sync failed:", e));
            } catch(e) {
                console.warn("Failed to prepare workout settings:", e);
            }
            
            document.getElementById('workoutContent').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
            markAccessoryDone();
        }

        function markAccessoryDone() {
            const card = document.getElementById('accessoryCard');
            card.classList.remove('open');
            card.classList.add('done');
            document.getElementById('accessoryLogger').style.display = 'none';
            document.getElementById('suggestDiffBtn').style.display = 'none';
        }

        function getAccessory() {
            document.getElementById('gotMoreBtn').style.display = 'none';
            document.getElementById('accessorySection').style.display = 'block';
            
            const loc = document.getElementById('locationSelect').value;
            const availableAcc = (globalData.exercises || []).filter(e => 
                e.category === 'Accessory' && 
                (e.location === 'Anywhere' || e.location === loc || !e.location) &&
                e.name !== currentAccessory
            );
            
            if(availableAcc.length === 0) {
                // If only 1 accessory exists total, we have to show it
                const onlyAcc = (globalData.exercises || []).filter(e => e.category === 'Accessory');
                if (onlyAcc.length > 0) {
                    currentAccessory = onlyAcc[0].name;
                } else {
                    document.getElementById('accessoryName').textContent = 'No accessories available';
                    return;
                }
            } else {
                const picked = availableAcc[Math.floor(Math.random() * availableAcc.length)];
                currentAccessory = picked.name;

            accessorySetCounter = 1;
            
            document.getElementById('accessoryName').textContent = currentAccessory;
            document.getElementById('accessoryRepRange').textContent = currentWorkout.repRange;

            activePeople.forEach(p => {

        } catch {}

        base = migrateRanges(base);

            const hasData = (sheetsData.history || []).length > 0 || Object.keys(sheetsData.best || {}).length > 0 || (sheetsData.exercises || []).length > 0;
            if (hasData) {
              const existingNames = new Set(base.map(e => e.name.toLowerCase()));
              const sheetNames = new Set([
                ...Object.keys(sheetsData.best || {}),
                ...(sheetsData.history || []).map(h => h.exercise).filter(Boolean),
                ...(sheetsData.exercises || []).map(e => e.name).filter(Boolean),
              ]);
              let nextId = Math.max(0, ...base.map(e => e.id), 0) + 1;
              for (const name of sheetNames) {
                if (!existingNames.has(name.toLowerCase())) {
                  const defBest = {};
                  localPeople.forEach(p => { defBest[p.toLowerCase()] = {}; });
                  base.push({ id: nextId++, name, timed: false, category: "", location: "Anywhere", best: defBest, history: [] });
                  existingNames.add(name.toLowerCase());
                }
              }
              base.sort((a, b) => a.name.localeCompare(b.name));

              const { exercises: merged, people: mergedPeople, locations: mergedLocations } = mergeFromSheets(base, sheetsData, localPeople, localLocations);
              const migrated = migrateRanges(merged);

              const incomingPeople = mergedPeople.filter(p => !localPeople.map(x => x.toLowerCase()).includes(p.toLowerCase()));
              let nextHidden = localHidden;
              if (incomingPeople.length > 0) {
                nextHidden = [...new Set([...localHidden, ...incomingPeople])];

          if (ex.timed) {
