      ) : null;

      if (loading) return <div style={s.center}><div className="spinner" style={s.spinner} /></div>;

      // ════════════════════════════════════════════════════════════════════════
      // SETTINGS VIEW
      // ════════════════════════════════════════════════════════════════════════
      // React Settings View Removed - Unified in Global Vanilla Modal
      if (view === "settings") {
          setView("list");
          setTimeout(() => { if(window.openSettings) window.openSettings(); }, 10);
          return null;
      }

      // ════════════════════════════════════════════════════════════════════════
      // LOG SET VIEW
      // ════════════════════════════════════════════════════════════════════════
      if (view === "log") {
        const ex = exercises.find(e => e.id === logExId);
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={finishLogging}>← Done</button>
              <div style={s.headerTitle}>LOG SET {setCount}</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={s.logExName}>{ex?.name}</div>
                {ex?.timed && <span style={s.timedBadge}>⏱ TIMED</span>}
              </div>

              <div style={s.whoLabel}>WHO'S WORKING OUT?</div>
              <div style={s.segmented}>
                {visiblePeople.length > 1 && (
                  <button style={{ ...s.segBtn, ...(whoMode === "all" ? s.segActive : {}) }}
                    onClick={() => setWhoMode("all")}>All</button>
                )}
                {visiblePeople.map(p => (
                  <button key={p}
                    style={{ ...s.segBtn, ...(whoMode === p ? s.segActive : {}) }}
                    onClick={() => setWhoMode(p)}>{p}</button>
                ))}
              </div>

              {sets.length > 0 && (
                <div style={s.setsLogged}>
                  <div style={s.setsLoggedTitle}>LOGGED THIS SESSION</div>
                  {sets.map((set, i) => {
                    const displayName = people.find(p => p.toLowerCase() === set.person) || set.person;
                    const result = set.timed
                      ? set.reps + (set.weight ? ` · ${set.weight}lbs` : "")
                      : (set.weight ? `${set.reps}x${set.weight}` : `${set.reps} reps`);
                    return (
                      <div key={i} style={s.setRow}>
                        <span style={s.setNum}>Set {set.setNum}</span>
                        <span style={s.setPerson}>{displayName}</span>
                        <span style={s.setRange}>{set.timed ? "⏱" : REP_RANGES.find(r => r.key === set.range)?.label}</span>
                        <span style={s.setResult}>{result}</span>
                      </div>
                    );
                  })}
                </div>
              )}

              {visiblePeople.map(person => {
                const key      = person.toLowerCase();
                const input    = logInputs[key] || {};
                const rangeKey = ex?.timed ? "r13_plus" : getRange(input.reps);
                const bestVal  = getBest(logExId, key, rangeKey || "r13_plus");
                return (
                  <div key={person} style={s.personBlock}>
                    <div style={s.personBlockLabel}>{person.toUpperCase()}</div>
                    <div style={s.inlineRow}>
                      {ex?.timed ? (
                        <div style={s.inlineField}>
                          <label style={s.label}>DURATION (mm:ss)</label>
                          <input
                            id={`duration-${key}`}
                            name={`duration-${key}`}
                            style={s.input}
                            placeholder="e.g. 1:30 or 90"
                            value={input.duration || ""}
                            onChange={e => updateLogInput(key, "duration", e.target.value)}
                          />
                          {input.duration && (
                            <div style={s.rangeTag}>⏱ {normalizeTimeInput(input.duration)}</div>
                          )}
                        </div>
                      ) : (
                        <div style={s.inlineField}>
                          <label style={s.label}>REPS</label>
                          <input
                            id={`reps-${key}`}
                            name={`reps-${key}`}
                            style={s.input}
                            placeholder="e.g. 8"
                            type="number"
                            value={input.reps || ""}
                            onChange={e => updateLogInput(key, "reps", e.target.value)}
                          />
                          {rangeKey && <div style={s.rangeTag}>{REP_RANGES.find(r => r.key === rangeKey)?.label}</div>}
                        </div>
                      )}
                      <div style={s.inlineField}>
                        <label style={s.label}>WEIGHT</label>
                        <input
                          id={`weight-${key}`}
                          name={`weight-${key}`}
                          style={s.input}
                          placeholder={ex?.timed ? "lbs (optional)" : "e.g. 135"}
                          value={input.weight || ""}
                          onChange={e => updateLogInput(key, "weight", e.target.value)}
                        />
                        {rangeKey && bestVal && <div style={s.bestTag}>Best: {bestVal}</div>}
                      </div>
                    </div>
                  </div>
                );
              })}

              <div style={s.inlineField}>
                <label style={s.label}>NOTE (optional)</label>
                <input
                  id="note-input"
                  name="note"
                  style={s.input}
                  placeholder="e.g. felt strong, pin #7"
                  value={logNote}
                  onChange={e => setLogNote(e.target.value)}
                />
              </div>
              {logError && <div style={s.error}>{logError}</div>}
              <div style={s.logBtnRow}>
                <button style={s.saveSetBtn} onClick={saveSet}>Save Set {setCount}</button>
                {sets.length > 0 && <button style={s.doneBtn} onClick={finishLogging}>Done</button>}
              </div>
            </div>
            {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════
      // ADD EXERCISE VIEW
      // ════════════════════════════════════════════════════════════════════════
      if (view === "add") {
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={() => setView("list")}>← Back</button>
              <div style={s.headerTitle}>NEW EXERCISE</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <label style={s.label}>EXERCISE NAME</label>
              <input
                style={s.input}
                placeholder="e.g. Plank"
                value={newName}
                autoFocus
                onChange={e => setNewName(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addExercise()}
              />
              <div style={s.whoLabel}>TRACKING TYPE</div>
              <div style={s.segmented}>
                <button style={{ ...s.segBtn, ...(!newExTimed ? s.segActive : {}) }}
                  onClick={() => setNewExTimed(false)}>REPS</button>
                <button style={{ ...s.segBtn, ...(newExTimed ? s.segActive : {}) }}
                  onClick={() => setNewExTimed(true)}>⏱ TIME</button>
              </div>
              {newExTimed && (
                <div style={s.timedNote}>
                  Duration logged in mm:ss. Stored in the 13+ bucket. Best = longest hold.
                  Tip: you can type plain seconds (e.g. 90) and it'll convert to 1:30.
                </div>
              )}
              <div style={s.whoLabel}>CATEGORY (optional)</div>
              <select
                style={{ ...s.input, color: newExCategory ? "#ddd" : "#555" }}
                value={newExCategory}
                onChange={e => setNewExCategory(e.target.value)}
              >
                <option value="">-- None --</option>
                {EXERCISE_CATEGORIES.map(cat => (
                  <option key={cat} value={cat}>{cat}</option>
                ))}
              </select>
              <div style={s.whoLabel}>LOCATION</div>
              <select
                style={{ ...s.input, color: newExLocation !== "Anywhere" ? "#ddd" : "#555" }}
                value={newExLocation}
                onChange={e => setNewExLocation(e.target.value)}
              >
                {locations.map(loc => (
                  <option key={loc} value={loc}>{loc}</option>
                ))}
              </select>
              
              <div style={whoLabel}>VARIATIONS</div>
              <div style={{ display: "flex", gap: 15, padding: "5px 0" }}>
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, cursor: "pointer" }}>
                      <input type="checkbox" checked={createSingle} onChange={e => setCreateSingle(e.target.checked)} />
                      Single Arm/Leg
                  </label>
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, cursor: "pointer" }}>
                      <input type="checkbox" checked={createAlt} onChange={e => setCreateAlt(e.target.checked)} />
                      Alternating
                  </label>
              </div>

              <button style={s.submitBtn} onClick={addExercise}>Add Exercise</button>
            </div>
            {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════
      // MAIN LIST VIEW
      // ════════════════════════════════════════════════════════════════════════
      return (
        <div style={s.root}>
          <div style={s.header}>
            <div>
              <div style={{ display: "flex", alignItems: "center" }}>
                <div style={s.title}>LIFT</div>
                {syncDot}
              </div>
              <div style={s.subtitle}>{visiblePeople.join(" & ")} · {exercises.length} exercises</div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={s.addIconBtn} onClick={() => { if(window.openSettings) window.openSettings(); }} title="Settings">⚙️</button>
              <button style={s.addIconBtn} onClick={() => setView("add")}>➕</button>
            </div>
          </div>

          <div style={s.searchWrap}>
            <span style={s.searchIcon}>🔍</span>
            <input
              style={s.searchInput}
              placeholder="Search exercises..."
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
            <select
              style={s.categoryFilter}
              value={categoryFilter}
              onChange={e => setCategoryFilter(e.target.value)}
            >
              <option value="">All Categories</option>
              {EXERCISE_CATEGORIES.map(cat => (
                <option key={cat} value={cat}>{cat}</option>
              ))}
            </select>
            {search && <button style={s.clearBtn} onClick={() => setSearch("")}>✕</button>}
          </div>
          <div style={s.locationTabRow}>
            <button
              style={{ ...s.locationTab, ...(locationFilter === "all" ? s.locationTabActive : {}) }}
              onClick={() => setLocationFilter("all")}>ALL</button>
            {locations.filter(l => l !== "Anywhere").map(loc => (
              <button key={loc}
                style={{ ...s.locationTab, ...(locationFilter === loc ? s.locationTabActive : {}) }}
                onClick={() => setLocationFilter(loc)}>{loc.toUpperCase()}</button>
            ))}
          </div>

          {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}

          {/* Delete confirm modal (exercise or history) */}
          {confirmDelete && confirmDelete.type !== "person" && (
            <div style={s.overlay}>
              <div style={s.modal}>
                <div style={s.modalTitle}>
                  {confirmDelete.type === "exercise" ? "Delete exercise?" : "Delete this entry?"}
                </div>
                <div style={s.modalSub}>
                  {confirmDelete.type === "exercise"
                    ? exercises.find(e => e.id === confirmDelete.exId)?.name
                    : "This will be removed and best results will update."}
                </div>
                <div style={s.modalBtns}>
                  <button style={s.cancelBtn} onClick={() => setConfirmDelete(null)}>Cancel</button>
                  <button style={s.confirmBtn} onClick={() =>
                    confirmDelete.type === "exercise"
                      ? deleteExercise(confirmDelete.exId)
                      : deleteHistoryEntry(confirmDelete.exId, confirmDelete.histIdx)
                  }>Delete</button>
                </div>
              </div>
            </div>
          )}

          <div style={s.listWrap}>
            {(() => {
                const grouped = {};
                filtered.forEach(ex => {
                    const base = getBaseName(ex.name);
                    if (!grouped[base]) grouped[base] = { baseName: base, variations: {} };
                    const mode = getMode(ex.name);
                    grouped[base].variations[mode] = ex;
                });

                return Object.values(grouped).map(group => {
                    const activeMode = exerciseModes[group.baseName] || 'std';
                    const ex = group.variations[activeMode] || Object.values(group.variations)[0];
                    const isExpanded = expanded === ex.id;
                    const hasData = visiblePeople.some(p => Object.keys(ex.best?.[p.toLowerCase()] || {}).length > 0);

                    return (
                        <div key={group.baseName} style={s.card}>
                            {/* SMART CARD HEADER: Variation Toggles */}
                            <div style={{ background: "#0a0a0a", display: "flex", borderBottom: "1px solid #161616", padding: "4px 12px", alignItems: "center", justifyContent: "space-between" }}>
                                <div style={{ display: "flex", gap: 4 }}>
                                    {['std', 'single', 'alt'].map(mode => {
                                        const exists = group.variations[mode];
                                        const isActive = activeMode === mode;
                                        if (!exists) return null;
                                        return (
                                            <button 
                                                key={mode}
                                                onClick={() => setExerciseModes(prev => ({ ...prev, [group.baseName]: mode }))}
                                                style={{ 
                                                    ...s.timedPill, 
                                                    background: isActive ? "#f97316" : "#1a1100", 
                                                    color: isActive ? "#000" : "#f97316",
                                                    borderColor: isActive ? "transparent" : "#f9731630"
                                                }}
                                            >
                                                {mode.toUpperCase()}
                                            </button>
                                        );
                                    })}
                                </div>
                                <div style={{ fontSize: 8, color: "#333", letterSpacing: 1 }}>SMART CARD</div>
                            </div>

                            <div style={s.cardHeader}>
                                <div style={{ display: "flex", alignItems: "center", flex: 1 }} onClick={() => setExpanded(isExpanded ? null : ex.id)}>
                                    <span style={s.chevron}>{isExpanded ? "▾" : "▸"}</span>
                                    <div style={s.cardName}>
                                        <div style={s.categoryLabel}>{ex.category?.toUpperCase()}</div>
                                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                                            {ex.name}
                                            {ex.timed && <span style={s.timedPill}>⏱</span>}
                                        </div>
                                        <div style={s.cardMax}>
                                            {visiblePeople.map(p => {
                                                const m = ex.best?.[p.toLowerCase()]?.['r8_12'];
                                                if (!m) return null;
                                                return <span key={p} style={{ marginRight: 8 }}>{p}: {m.reps}x{m.weight}</span>;
                                            })}
                                        </div>
                                    </div>
                                </div>
                                    {exerciseStatus[ex.name] && (
                                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginRight: 8 }}>
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); toggleStatus(ex.name, 'undo'); }}
                                            style={{ background: 'rgba(249,115,22,0.1)', color: 'var(--accent)', border: '1px solid var(--accent)', borderRadius: 4, padding: '2px 6px', fontSize: 9, fontFamily: 'var(--mono)', fontWeight: 700, cursor: 'pointer', letterSpacing: '1px' }}
                                        >
                                            UNDO
                                        </button>
                                        <span style={{ fontSize: 18, color: exerciseStatus[ex.name] === 'done' ? '#22c55e' : '#666', fontWeight: 'bold' }}>
                                            {exerciseStatus[ex.name] === 'done' ? '✓' : '—'}
                                        </span>
                                    </div>
                                )}
                                <div style={s.cardActions}>
                                    <button style={s.historyBtn} onClick={(e) => { e.stopPropagation(); openHistory(ex.id); }}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ color: historyExId === ex.id ? "var(--accent)" : "currentColor" }}>
                                            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                                        </svg>
                                    </button>
                                    <button style={s.logBtn} onClick={() => openLog(ex.id)}>LOG</button>
                                    <button style={s.delBtn} onClick={() => setConfirmDelete({ type: "exercise", exId: ex.id })}>✕</button>
                                </div>
                            </div>

                            {/* History Drawer */}
                            {historyExId === ex.id && (
                                <div style={{ background: "#0e0e0e", borderTop: "1px solid #1a1a1a", borderBottom: "1px solid #1a1a1a", padding: "12px 16px" }}>
                                    <div style={{ fontSize: 10, color: "#444", letterSpacing: 2, marginBottom: 8, fontWeight: 700 }}>RECENT HISTORY</div>
                                    {(!ex.history || ex.history.length === 0) ? (
                                        <div style={{ padding: 10, textAlign: "center", color: "#444", fontSize: 12 }}>No history found for this exercise.</div>
                                    ) : (
                                        ex.history.slice(-10).reverse().map((h, i) => (
                                            <div key={i} style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, paddingBottom: 6, borderBottom: "1px solid #1a1a1a" }}>
                                                <div style={{ flex: 1 }}>
                                                    <div style={{ fontSize: 10, color: "#666" }}>{h.date || "Unknown Date"}</div>
                                                    <div style={{ fontSize: 11, color: "var(--accent)", fontWeight: 600 }}>{h.person?.toUpperCase()}</div>
                                                    {h.note && <div style={{ fontSize: 10, color: "#555", fontStyle: "italic", marginTop: 2 }}>{h.note}</div>}
                                                </div>
                                                <div style={{ textAlign: "right", display: "flex", alignItems: "center", gap: 8 }}>
                                                    <div>
                                                        <div style={{ fontSize: 12, fontWeight: 600, color: "#ddd" }}>
                                                            {ex.timed ? `${h.reps}${h.weight ? ` · ${h.weight}lbs` : ""}` : (h.weight ? `${h.reps}x${h.weight}` : `${h.reps} reps`)}
                                                        </div>
                                                        <div style={{ fontSize: 9, color: "#444", fontFamily: "var(--mono)" }}>{ex.timed ? "⏱" : h.range?.replace("r", "").replace("_", "-")}</div>
                                                    </div>
                                                    <button onClick={() => deleteLog(ex.id, h)} style={{ background: "none", border: "none", color: "#ff4444", cursor: "pointer", padding: 4, opacity: 0.6 }} title="Delete Entry">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}

                            {/* Best results grid */}
                            {hasData && (
                                <div style={s.rangeGrid}>
                                  {ex.timed ? (
                                    /* Timed: single "Best Duration" column */
                                    <div>
                                      <div style={s.rangeHeaderRow}>
                                        <div style={s.personCol} />
                                        <div style={{ ...s.rangeColHeader, flex: 2, textAlign: "left" }}>BEST DURATION</div>
                                        <div style={s.rangeColHeader}>WEIGHT</div>
                                      </div>
                                      {visiblePeople.map(person => {
                                        const b = ex.best?.[person.toLowerCase()]?.["r13_plus"];
                                        return (
                                          <div key={person} style={s.rangeRow}>
                                            <div style={s.personCol}>{person}</div>
                                            <div style={{ ...s.rangeCell, flex: 2, ...(b ? s.rangeCellFilled : {}), textAlign: "left" }}>
                                              {b ? b.reps : <span style={s.dash}>—</span>}
                                            </div>
                                            <div style={{ ...s.rangeCell, ...(b?.weight ? s.rangeCellFilled : {}) }}>
                                              {b?.weight || <span style={s.dash}>—</span>}
                                            </div>
                                          </div>
                                        );
                                      })}
                                    </div>
                                  ) : (
                                    /* Reps: full 4-column range grid */
                                    <div>
                                      <div style={s.rangeHeaderRow}>
                                        <div style={s.personCol} />
                                        {REP_RANGES.map(r => <div key={r.key} style={s.rangeColHeader}>{r.label}</div>)}
                                      </div>
                                      {visiblePeople.map(person => (
                                        <div key={person} style={s.rangeRow}>
                                          <div style={s.personCol}>{person}</div>
                                          {REP_RANGES.map(r => {
                                            const b   = ex.best?.[person.toLowerCase()]?.[r.key];
                                            const val = b ? (b.weight ? `${b.reps}x${b.weight}` : `${b.reps} reps`) : null;
                                            return (
                                              <div key={r.key} style={{ ...s.rangeCell, ...(val ? s.rangeCellFilled : {}) }}>
                                                {val || <span style={s.dash}>—</span>}
                                              </div>
                                            );
                                          })}
                                        </div>
                                      ))}
                                    </div>
                                  )}
                                </div>
                            )}

                            {/* History */}
                            {isExpanded && (
                                <div style={s.history}>
                                  {(ex.history || []).length === 0 ? (
                                    <div style={s.noHistory}>No history yet. Tap + LOG to add a result.</div>
                                  ) : (
                                    <>
                                      <div style={s.historyTitle}>HISTORY</div>
                                      {(ex.history || []).map((h, i) => {
                                        const displayName = people.find(p => p.toLowerCase() === h.person) || h.person;
                                        const result = h.timed
                                          ? h.reps + (h.weight ? ` · ${h.weight}lbs` : "")
                                          : (h.weight ? `${h.reps}x${h.weight}` : `${h.reps} reps`);
                                        return (
                                          <div key={i} style={s.historyRow}>
                                            <div style={s.historyLeft}>
                                              <div style={s.historyDate}>{h.date}{h.setNum ? ` · Set ${h.setNum}` : ""}</div>
                                              <div style={s.historyMeta}>
                                                <span style={s.historyPerson}>{displayName}</span>
                                                <span style={s.historyRange}>
                                                  {h.timed ? "⏱" : REP_RANGES.find(r => r.key === h.range)?.label}
                                                </span>
                                                <span style={s.historyResult}>{result}</span>
                                              </div>
                                              {h.note ? <div style={s.historyNote}>{h.note}</div> : null}
                                            </div>
                                            <button style={{ ...s.histDelBtn, color: "#ff4444", opacity: 0.6 }}
                                              onClick={() => setConfirmDelete({ type: "history", exId: ex.id, histIdx: i })}
                                              title="Delete Entry">
                                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                            </button>
                                          </div>
                                        );
                                      })}
                                    </>
                                  )}
                                </div>
                            )}
                        </div>
                    );
                });
            })()}
            {filtered.length === 0 && (
              <div style={s.noResults}>{search ? `No results for "${search}"` : "No exercises yet"}</div>
            )}
          </div>
        </div>
      );
    }

    // ── STYLES ────────────────────────────────────────────────────────────────
    const s = {
      root:             { background: "#0c0c0c", height: "100dvh", fontFamily: "'DM Mono','Courier New',monospace", color: "#ddd", display: "flex", flexDirection: "column", overflow: "hidden" },
      center:           { background: "#0c0c0c", height: "100dvh", display: "flex", alignItems: "center", justifyContent: "center" },
      spinner:          { width: 24, height: 24, border: "2px solid #222", borderTop: "2px solid #f97316", borderRadius: "50%" },
      header:           { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "18px 16px 12px", borderBottom: "1px solid #1a1a1a", flexShrink: 0 },
      title:            { fontSize: 20, fontWeight: 700, letterSpacing: 5, color: "#f97316" },
      subtitle:         { fontSize: 10, color: "#444", letterSpacing: 2, marginTop: 3 },
