          // Sync Location Filter
          const activeLoc = localStorage.getItem(ACTIVE_LOCATION_KEY);
          if (activeLoc) setLocationFilter(activeLoc === 'Anywhere' ? 'all' : activeLoc);
        };
        
        window.addEventListener('gym-settings-updated', handleSync);
        window.refreshLiftData = () => loadData();
        return () => {
          window.removeEventListener('gym-settings-updated', handleSync);
          delete window.refreshLiftData;
        };
      }, []);

      const addVariation = async (group, mode) => {
          const parent = group.variations['std'] || Object.values(group.variations)[0];
          const base = group.baseName;
          const newName = mode === 'single' ? `${base} (Single)` : `${base} (Alt)`;
          
          if (exercises.some(e => e.name.toLowerCase() === newName.toLowerCase())) {
              setExerciseModes(prev => ({ ...prev, [base]: mode }));
              return;
          }

          setSyncStatus("syncing");
          const maxId = exercises.reduce((m, e) => Math.max(m, e.id), 0);
          const defBest = {};
          people.forEach(p => { defBest[p.toLowerCase()] = {}; });
          
          const newEx = {
            id: maxId + 1,
            name: newName,
            timed: parent.timed,

            best: defBest,
            history: [],

          const updated = [...exercises, newEx].sort((a, b) => a.name.localeCompare(b.name));

                  exercise: newEx.name, 
                  timed: newEx.timed, 
                  category: newEx.category,

      // ── LOAD ───────────────────────────────────────────────────────────────
      const loadData = async (isRetry = false) => {
        // Step 1: read people + locations from localStorage
        let localPeople = DEFAULT_PEOPLE;
        try {
          const sp = JSON.parse(localStorage.getItem(PEOPLE_KEY));
          if (sp && Array.isArray(sp) && sp.length > 0) localPeople = sp;
        } catch {}

        let localLocations = DEFAULT_LOCATIONS;
        try {
          const sl = JSON.parse(localStorage.getItem(LOCATIONS_KEY));
          if (sl && Array.isArray(sl) && sl.length > 0) localLocations = sl;
        } catch {}

        // Step 2: read exercises from localStorage
        let base = [];
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved)) {
            base = saved.map(ex => {
              if (!ex.best) {
                const b = {};
                localPeople.forEach(p => { b[p.toLowerCase()] = {}; });
                return { ...ex, timed: ex.timed ?? false, category: ex.category || "", location: ex.location || "Anywhere", best: b };
              }
              return { ...ex, timed: ex.timed ?? false, category: ex.category || "", location: ex.location || "Anywhere" };
            });
          }
        } catch {}

        base = migrateRanges(base);
        let localHidden = [];
        try {
          const lh = JSON.parse(localStorage.getItem(HIDDEN_PEOPLE_KEY));
          if (lh && Array.isArray(lh)) localHidden = lh;
        } catch {}

        setPeople(localPeople);
        setLocations(localLocations);
        setHiddenPeople(localHidden);
        setExercises(base);
        setLoading(false);

        // Step 3: sync from Sheets (with retry logic)
        if (scriptConfigured) {
          setSyncStatus("syncing");
          try {
            const sheetsData = await sheetsGet();
            const hasData = (sheetsData.history || []).length > 0 || Object.keys(sheetsData.best || {}).length > 0 || (sheetsData.exercises || []).length > 0;
            if (hasData) {
              const existingNames = new Set(base.map(e => e.name.toLowerCase()));
              const sheetNames = new Set([
                ...Object.keys(sheetsData.best || {}),
                ...(sheetsData.history || []).map(h => h.exercise).filter(Boolean),
                ...(sheetsData.exercises || []).map(e => e.name).filter(Boolean),
              ]);
              let nextId = Math.max(0, ...base.map(e => e.id), 0) + 1;
              for (const name of sheetNames) {
                if (!existingNames.has(name.toLowerCase())) {
                  const defBest = {};
                  localPeople.forEach(p => { defBest[p.toLowerCase()] = {}; });
                  base.push({ id: nextId++, name, timed: false, category: "", location: "Anywhere", best: defBest, history: [] });
                  existingNames.add(name.toLowerCase());
                }
              }
              base.sort((a, b) => a.name.localeCompare(b.name));

              const { exercises: merged, people: mergedPeople, locations: mergedLocations } = mergeFromSheets(base, sheetsData, localPeople, localLocations);
              const migrated = migrateRanges(merged);

              const incomingPeople = mergedPeople.filter(p => !localPeople.map(x => x.toLowerCase()).includes(p.toLowerCase()));
              let nextHidden = localHidden;
              if (incomingPeople.length > 0) {
                nextHidden = [...new Set([...localHidden, ...incomingPeople])];
                setHiddenPeople(nextHidden);
                localStorage.setItem(HIDDEN_PEOPLE_KEY, JSON.stringify(nextHidden));
              }

              setPeople(mergedPeople);
              setExercises(migrated);
              if (mergedLocations && mergedLocations.length > 0) {
                setLocations(mergedLocations);
                localStorage.setItem(LOCATIONS_KEY, JSON.stringify(mergedLocations));
              }
              localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
              localStorage.setItem(PEOPLE_KEY, JSON.stringify(mergedPeople));
            }
            setSyncStatus("ok");
            setLastSyncTime(new Date());
            
            // MASTER SYNC PUSH
            window.ultimateSyncData = sheetsData;
            if (window.updatePlanData) {
                window.updatePlanData(sheetsData);
            }
          } catch (err) {
            console.warn("Sync attempt failed:", err);
            if (!isRetry) {
                console.log("Retrying sync in 2 seconds...");
                setTimeout(() => loadData(true), 2000);
                return;
            }
            setSyncStatus("error");
            showToast("Sheets sync failed — working offline", "error");
          }
        }
      };

      // ── PERSIST ────────────────────────────────────────────────────────────
      const persist = async (newExercises, newPeople = null, sheetsPayload = null) => {
        setExercises(newExercises);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(newExercises));
        if (newPeople) {
          setPeople(newPeople);
          localStorage.setItem(PEOPLE_KEY, JSON.stringify(newPeople));
        }
        if (scriptConfigured && sheetsPayload) {
          setSyncStatus("syncing");
          try {
            await sheetsPost(sheetsPayload);
            setSyncStatus("ok");
          } catch {
            setSyncStatus("error");
            showToast("Saved locally — Sheets sync failed", "error");
          }
        }
      };

      // People currently being tracked in the log screen
      const visiblePeople = people.filter(p => !hiddenPeople.includes(p));
      const activePeople = whoMode === "all" ? visiblePeople : [people.find(p => p === whoMode)].filter(Boolean);

      // ── LOG SCREEN HELPERS ─────────────────────────────────────────────────
      const openHistory = (id) => {
        setHistoryExId(historyExId === id ? null : id);
        setEditExId(null);
      };

      const saveInlineMetadata = async (exId, newCat, newLoc) => {
        const ex = exercises.find(e => e.id === exId);
        if (!ex) return;
        
        setSyncStatus("syncing");
        try {
            await sheetsPost({ 
                action: "saveExercise", 
                exercise: ex.name, 
                timed: ex.timed, 
                category: newCat, 
                location: newLoc 
            });
            const updated = exercises.map(e => e.id === exId ? { ...e, category: newCat, location: newLoc } : e);
            setExercises(updated);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
            setEditExId(null);
            showToast("Metadata Saved ✓");
            setSyncStatus("ok");

            showToast("Failed to save metadata", "error");
            setSyncStatus("error");
        }

      const getBest = (exId, personKey, rangeKey) => {
        const ex = exercises.find(e => e.id === exId);
        const b  = ex?.best?.[personKey]?.[rangeKey];
        if (!b) return null;

        return b.weight ? `${b.reps}x${b.weight}` : `${b.reps} reps`;

      // ── SAVE SET ──────────────────────────────────────────────────────────
      const saveSet = async () => {
        if (isSavingSet) return; // Guard against double-tap
        setIsSavingSet(true);
        const ex = exercises.find(e => e.id === logExId);
        const date = todayStr();
        const newEntries = [];
        let err = "";

        for (const person of activePeople) {
          const key   = person.toLowerCase();
          const input = logInputs[key] || {};

          if (ex.timed) {
            const rawDur = input.duration?.trim();
            if (!rawDur) continue; // Skip if empty
            const normalized = normalizeTimeInput(rawDur);
            if (parseTime(normalized) <= 0) { err = `Invalid duration for ${person}`; break; }
            const perPersonNote = input.note?.trim() || "";
            const finalNote = perPersonNote ? `${perPersonNote} — Set ${setCount} (Workout #${localStorage.getItem('gym-workout-num') || localStorage.getItem('builder_workout_num') || "?"})` : `Set ${setCount} (Workout #${localStorage.getItem('gym-workout-num') || localStorage.getItem('builder_workout_num') || "?"})`;

            newEntries.push({
              date, person: key, reps: normalized, weight: input.weight || "",
              range: "r13_plus", note: finalNote, setNum: setCount, timed: true,

          } else {

            const finalNote = perPersonNote ? `${perPersonNote} — Set ${setCount} (Workout #${localStorage.getItem('gym-workout-num') || localStorage.getItem('builder_workout_num') || "?"})` : `Set ${setCount} (Workout #${localStorage.getItem('gym-workout-num') || localStorage.getItem('builder_workout_num') || "?"})`;

      const deleteLog = async (exId, entry) => {

        const ex = exercises.find(e => e.id === id);
        if (!ex) return;
        const updated = exercises.filter(e => e.id !== id);
        await persist(updated, null, { action: "deleteExercise", exercise: ex.name });
        setConfirmDelete(null);
        if (expanded === id) setExpanded(null);
        showToast("Deleted");
      };

      // ── ADD EXERCISE ───────────────────────────────────────────────────────
      const addExercise = async () => {
        if (!newName.trim()) return showToast("Name required", "error");
        if (exercises.some(e => e.name.toLowerCase() === newName.trim().toLowerCase()))
          return showToast("Already exists", "error");

        const baseName = newName.trim();
        const namesToCreate = [baseName];
        if (createSingle) namesToCreate.push(`${baseName} (Single)`);
        if (createAlt)    namesToCreate.push(`${baseName} (Alt)`);

        let currentExercises = [...exercises];
        
        for (const name of namesToCreate) {
            const maxId = currentExercises.reduce((m, e) => Math.max(m, e.id), 0);
            const defBest = {};
            people.forEach(p => { defBest[p.toLowerCase()] = {}; });
            const newEx = {
              id: maxId + 1, name: name, timed: newExTimed,
              category: newExCategory, location: newExLocation, best: defBest, history: [],
            };
            currentExercises = [...currentExercises, newEx];
            
            if (scriptConfigured) {
              try {
                await sheetsPost({ action: "saveExercise", exercise: newEx.name, timed: newEx.timed, category: newEx.category, location: newEx.location });
              } catch {}
            }
        }

        const sorted = currentExercises.sort((a, b) => a.name.localeCompare(b.name));
        await persist(sorted);

        setNewName(""); setNewExTimed(false); setNewExCategory(""); setNewExLocation("Anywhere");
        setCreateSingle(false); setCreateAlt(false);
        showToast(namesToCreate.length > 1 ? "Exercises added!" : "Exercise added!");
        setView("list");
      };

      // ── PEOPLE MANAGEMENT ──────────────────────────────────────────────────
      const addPerson = async () => {
        if (!newPersonName.trim()) return showToast("Name required", "error");
        const trimmed = newPersonName.trim();
        if (people.map(p => p.toLowerCase()).includes(trimmed.toLowerCase()))
          return showToast("Already on the list", "error");
        const newPeople = [...people, trimmed];
        // Ensure all exercises have a best slot for this person
        const updatedEx = exercises.map(ex => {
          const nb = { ...(ex.best || {}) };
          nb[trimmed.toLowerCase()] = {};
          return { ...ex, best: nb };
        });
        await persist(updatedEx, newPeople, { action: "savePeople", people: newPeople });
        setNewPersonName("");
        showToast(`${trimmed} added!`);
      };

      const removePerson = async (name) => {
        if (people.length <= 1) return showToast("Need at least one person", "error");
        const newPeople = people.filter(p => p !== name);
        await persist(exercises, newPeople, { action: "savePeople", people: newPeople });
        if (whoMode === name) setWhoMode("all");
        setConfirmDelete(null);
        showToast(`${name} removed from roster`);
      };

      const togglePersonVisibility = (name) => {
        const isHidden = hiddenPeople.includes(name);
        const newHidden = isHidden
          ? hiddenPeople.filter(h => h !== name)
          : [...hiddenPeople, name];
        setHiddenPeople(newHidden);
        localStorage.setItem(HIDDEN_PEOPLE_KEY, JSON.stringify(newHidden));
        if (!isHidden && whoMode === name) setWhoMode("all");
        showToast(isHidden ? `${name} shown on this device` : `${name} hidden on this device`);
        window.dispatchEvent(new Event('gym-settings-updated'));
      };

      // ── LOCATION MANAGEMENT ───────────────────────────────────────────────────
      const addLocation = async () => {
        if (!newLocName.trim()) return showToast("Name required", "error");
        const trimmed = newLocName.trim();
        if (locations.map(l => l.toLowerCase()).includes(trimmed.toLowerCase()))
          return showToast("Already on the list", "error");
        const newLocs = [...locations, trimmed];
        setLocations(newLocs);
        localStorage.setItem(LOCATIONS_KEY, JSON.stringify(newLocs));
        if (scriptConfigured) {
          try { await sheetsPost({ action: "syncMeta", people, locations: newLocs, exercises: [] }); } catch {}
        }
        setNewLocName("");
        showToast(`${trimmed} added!`);
      };

      const removeLocation = (name) => {
        if (name === "Anywhere") return showToast("Anywhere cannot be removed", "error");
        const newLocs = locations.filter(l => l !== name);
        setLocations(newLocs);
        localStorage.setItem(LOCATIONS_KEY, JSON.stringify(newLocs));
        if (locationFilter === name) setLocationFilter("all");
        setConfirmDelete(null);
        showToast(`${name} removed`);
      };

      // ── MANUAL SYNC ────────────────────────────────────────────────────────
      // Only syncs the people roster. Exercise metadata (location, category, timed)
      // syncs individually via saveExercise on add/edit to avoid overwriting
      // data set directly in the sheet or on another device.
      const manualSync = async () => {
        if (syncStatus === "syncing") return;
        setSyncStatus("syncing");
        try {
          await sheetsPost({ action: "savePeople", people });
          setSyncStatus("ok");
          setLastSyncTime(new Date());
          showToast("Roster synced to Sheets ✓");
        } catch (e) {
          setSyncStatus("error");
          showToast("Sync failed: " + (e?.message || "unknown error"), "error");
        }
      };



      const filtered = exercises.filter(e => {
        const nameMatch = e.name.toLowerCase().includes(search.toLowerCase());
        const catMatch  = !categoryFilter || e.category === categoryFilter;
        // Anywhere exercises appear under ALL location filters
        const locMatch  = locationFilter === "all" 
          || e.location === "Anywhere"
          || !e.location
          || e.location === locationFilter;
        return nameMatch && catMatch && locMatch;
      });

      const syncDot = scriptConfigured ? (
        <div
          title={syncStatus === "error" ? "Sync error — go to Settings to retry" : syncStatus === "syncing" ? "Syncing..." : "Synced"}
          style={{
            width: 8, height: 8, borderRadius: "50%", marginLeft: 8,
            cursor: "default",
            background: syncStatus === "ok" ? "#22c55e" : syncStatus === "error" ? "#ef4444" : "#f97316",
            animation: syncStatus === "syncing" ? "spin 1s linear infinite" : "none", flexShrink: 0,
          }}
        />
      ) : null;

      if (loading) return <div style={s.center}><div className="spinner" style={s.spinner} /></div>;

      // ════════════════════════════════════════════════════════════════════════
      // SETTINGS VIEW
      // ════════════════════════════════════════════════════════════════════════
      // React Settings View Removed - Unified in Global Vanilla Modal
      if (view === "settings") {
          setView("list");
          setTimeout(() => { if(window.openSettings) window.openSettings(); }, 10);
          return null;
      }

      // ════════════════════════════════════════════════════════════════════════
      // LOG SET VIEW
      // ════════════════════════════════════════════════════════════════════════
      if (view === "log") {
        const ex = exercises.find(e => e.id === logExId);
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={finishLogging}>← Done</button>
              <div style={s.headerTitle}>LOG SET {setCount}</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={s.logExName}>{ex?.name}</div>
                {ex?.timed && <span style={s.timedBadge}>⏱ TIMED</span>}
              </div>

              <div style={s.whoLabel}>WHO'S WORKING OUT?</div>
              <div style={s.segmented}>
                {visiblePeople.length > 1 && (
                  <button style={{ ...s.segBtn, ...(whoMode === "all" ? s.segActive : {}) }}
                    onClick={() => setWhoMode("all")}>All</button>
                )}
                {visiblePeople.map(p => (
                  <button key={p}
                    style={{ ...s.segBtn, ...(whoMode === p ? s.segActive : {}) }}
                    onClick={() => setWhoMode(p)}>{p}</button>
                ))}
              </div>

              {sets.length > 0 && (
                <div style={s.setsLogged}>
                  <div style={s.setsLoggedTitle}>LOGGED THIS SESSION</div>
                  {sets.map((set, i) => {
                    const displayName = people.find(p => p.toLowerCase() === set.person) || set.person;
                    const result = set.timed
                      ? set.reps + (set.weight ? ` · ${set.weight}lbs` : "")
                      : (set.weight ? `${set.reps}x${set.weight}` : `${set.reps} reps`);
                    return (
                      <div key={i} style={s.setRow}>
                        <span style={s.setNum}>Set {set.setNum}</span>
                        <span style={s.setPerson}>{displayName}</span>
                        <span style={s.setRange}>{set.timed ? "⏱" : REP_RANGES.find(r => r.key === set.range)?.label}</span>
                        <span style={s.setResult}>{result}</span>
                      </div>
                    );
                  })}
                </div>
              )}

              {visiblePeople
                .filter(person => whoMode === "all" || whoMode === person)
                .map(person => {
                const key      = person.toLowerCase();
                const input    = logInputs[key] || {};
                const rangeKey = ex?.timed ? "r13_plus" : getRange(input.reps);
                const bestVal  = getBest(logExId, key, rangeKey || "r13_plus");
                return (
                  <div key={person} style={{ ...s.personBlock, marginBottom: 16 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                        <div style={{ ...s.personBlockLabel, marginBottom: 0 }}>{person.toUpperCase()}</div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          {ex?.timed ? (
                            <div style={s.inlineField}>
                              <input
                                id={`duration-${key}`}
                                style={{ ...s.input, width: 80, textAlign: "center" }}
                                placeholder="mm:ss"
                                value={input.duration || ""}
                                onChange={e => updateLogInput(key, "duration", e.target.value)}
                              />
                            </div>
                          ) : (
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <input
                                id={`reps-${key}`}
                                style={{ ...s.input, width: 60, textAlign: "center" }}
                                placeholder="Reps"
                                type="number"
                                value={input.reps || ""}
                                onChange={e => updateLogInput(key, "reps", e.target.value)}
                              />
                              <span style={{ color: "#333", fontWeight: "bold" }}>X</span>
                            </div>
                          )}
                          <input
                            id={`weight-${key}`}
                            style={{ ...s.input, width: 70, textAlign: "center" }}
                            placeholder={ex?.timed ? "lbs" : "lbs"}
                            value={input.weight || ""}
                            onChange={e => updateLogInput(key, "weight", e.target.value)}
                          />
                        </div>
                    </div>
                    <input 
                      placeholder={`Note for ${person}...`}
                      style={{ ...s.input, fontSize: 11, padding: "6px 12px", background: "#050505", border: "1px solid #1a1a1a", color: "#888" }}
                      value={input.note || ""}
                      onChange={e => updateLogInput(key, "note", e.target.value)}
                    />
                    <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                        {rangeKey && <div style={{ ...s.rangeTag, fontSize: 9 }}>{REP_RANGES.find(r => r.key === rangeKey)?.label}</div>}
                        {rangeKey && bestVal && <div style={{ ...s.bestTag, fontSize: 9 }}>Best: {bestVal}</div>}
                    </div>
                  </div>
                );
              })}


              {logError && <div style={s.error}>{logError}</div>}
              <div style={s.logBtnRow}>
                <button 
                  style={{
                    ...s.saveSetBtn,
                    background: isSavingSet ? "rgba(249, 115, 22, 0.2)" : "rgba(249, 115, 22, 0.05)",
                    color: "#f97316",
                    border: isSavingSet ? "2px solid #f97316" : "2px solid #f9731680",
                    opacity: 1, // Full opacity for text visibility
                    cursor: isSavingSet ? "not-allowed" : "pointer",
                    textTransform: "uppercase",
                    letterSpacing: "1px"
                  }}
                  disabled={isSavingSet}
                  onClick={saveSet}
                >
                  {isSavingSet ? `Logging Set ${setCount}...` : `Log Set ${setCount}`}
                </button>
                {sets.length > 0 && <button style={s.doneBtn} onClick={finishLogging}>Done</button>}
              </div>
            </div>
            {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════
      // ADD EXERCISE VIEW
      // ════════════════════════════════════════════════════════════════════════
      if (view === "add") {
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={() => setView("list")}>← Back</button>
              <div style={s.headerTitle}>NEW EXERCISE</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <label style={s.label}>EXERCISE NAME</label>
              <input
                style={s.input}
                placeholder="e.g. Plank"
                value={newName}
                autoFocus
                onChange={e => setNewName(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addExercise()}
              />
              <div style={s.whoLabel}>TRACKING TYPE</div>
              <div style={s.segmented}>
                <button style={{ ...s.segBtn, ...(!newExTimed ? s.segActive : {}) }}
                  onClick={() => setNewExTimed(false)}>REPS</button>
                <button style={{ ...s.segBtn, ...(newExTimed ? s.segActive : {}) }}
                  onClick={() => setNewExTimed(true)}>⏱ TIME</button>
              </div>

              <label style={s.label}>CATEGORY (OPTIONAL)</label>
              <input
                style={s.input}
                placeholder="e.g. Knee Dominant"
                value={newExCategory}
                onChange={e => setNewExCategory(e.target.value)}
              />

              <label style={s.label}>LOCATION (OPTIONAL)</label>
              <select 
                style={s.input}
                value={newExLocation}
                onChange={e => setNewExLocation(e.target.value)}
              >
                {locations.map(l => <option key={l} value={l}>{l}</option>)}
              </select>

              <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 8 }}>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                    <input type="checkbox" checked={createSingle} onChange={e => setCreateSingle(e.target.checked)} />
                    <span style={{ fontSize: 13, color: "#999" }}>+ Create "(Single)" Variation</span>
                </label>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                    <input type="checkbox" checked={createAlt} onChange={e => setCreateAlt(e.target.checked)} />
                    <span style={{ fontSize: 13, color: "#999" }}>+ Create "(Alt)" Variation</span>
                </label>
              </div>

              <button style={{ ...s.saveSetBtn, marginTop: 32 }} onClick={addExercise}>Save Exercise</button>
            </div>
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════
      // MAIN LIST VIEW
      // ════════════════════════════════════════════════════════════════════════
      // Group exercises by base name
      const grouped = {};
      filtered.forEach(ex => {
          const base = getBaseName(ex.name);
          if (!grouped[base]) grouped[base] = { baseName: base, variations: {} };
          grouped[base].variations[getMode(ex.name)] = ex;
      });
      const groups = Object.values(grouped);

      return (
        <div style={s.root}>
          <div style={s.header}>
            <div style={s.headerLeft}>
              <h1 style={{ fontSize: 20, fontWeight: 700, letterSpacing: 5, color: "#f97316" }}>LIFT</h1>
              <div style={{ display: "flex", alignItems: "center" }}>
                <p style={s.headerSub}>STABILIZATION V4.0</p>
                {syncDot}
              </div>
            </div>
            <div style={s.headerRight}>
              <button style={s.iconBtn} onClick={() => setView("settings")}>⚙️</button>
            </div>
          </div>

          <div style={s.searchBar}>
            <input
              style={s.searchInput}
              placeholder="Search machines..."
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
          </div>

          <div style={s.filterRow}>
            <select style={s.filterSelect} value={locationFilter} onChange={e => setLocationFilter(e.target.value)}>
                <option value="all">ANYWHERE / ALL LOCATIONS</option>
                {locations.filter(l => l !== 'Anywhere').map(l => <option key={l} value={l}>{l.toUpperCase()}</option>)}
            </select>
            <select style={s.filterSelect} value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}>
                <option value="">ALL CATEGORIES</option>
                {[...new Set(exercises.map(e => e.category).filter(Boolean))].sort().map(c => <option key={c} value={c}>{c.toUpperCase()}</option>)}
            </select>
          </div>

          <div style={s.list}>
            {groups.length === 0 ? (
              <div style={s.empty}>No matches</div>
            ) : (
              groups.map(group => {
                const mode = exerciseModes[group.baseName] || (group.variations['std'] ? 'std' : Object.keys(group.variations)[0]);
                const ex = group.variations[mode] || Object.values(group.variations)[0];
                const isOpen = expanded === ex.id;
                const isDone = exerciseStatus[ex.name] === 'done';

                return (
                  <div key={group.baseName} className={`exercise-card${isDone ? ' done' : ''}`}>
                    {/* SMART HEADER */}
                    <div style={s.smartHeader}>
                        <div style={{ display: "flex", gap: 4 }}>
                            {['std', 'single', 'alt'].map(m => {
                                const exists = group.variations[m];
                                const isActive = mode === m;
                                const label = m.toUpperCase();
                                return (
                                    <button 
                                        key={m}
                                        onClick={() => exists ? setExerciseModes(prev => ({ ...prev, [group.baseName]: m })) : addVariation(group, m)}
                                        style={{ 
                                            ...s.modeBtn, 
                                            ...(isActive ? s.modeActive : {}),
                                            ...(!exists ? s.modeMissing : {})
                                        }}
                                    >
                                        {exists ? label : `+ ${label}`}
                                    </button>
                                );
                            })}
                        </div>
                        <div style={s.smartTag}>SMART CARD</div>
                    </div>

                    <div className="exercise-header" onClick={() => setExpanded(isOpen ? null : ex.id)}>
                      <div style={{ flex: 1 }}>
                        <div className="exercise-category">{ex.category}</div>
                        <div className="exercise-name">{ex.name}</div>
                        <div style={s.maxRow}>
                          {visiblePeople.slice(0, 3).map(p => {
                            const rangeKey = "r8_12"; // Default visual range
                            const b = getBest(ex.id, p.toLowerCase(), rangeKey);
                            return <span key={p} style={s.maxItem}>{p}: <span style={s.maxVal}>{b || "—"}</span></span>;
                          })}
                        </div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        {isDone && <span style={{ color: "#22c55e", fontWeight: "bold" }}>✓</span>}
                        <button 
                          title="Exercise Settings"
                          style={{ background: "none", border: "1px solid #2a2a2a", borderRadius: 8, color: "#666", fontSize: 14, cursor: "pointer", padding: "4px 8px" }}
                          onClick={(e) => { 
                            e.stopPropagation(); 
                            setEditExId(editExId === ex.id ? null : ex.id); 
                            setHistoryExId(null); 
                            if (!isOpen && editExId !== ex.id) setExpanded(ex.id);
                          }}
                        >⚙️</button>
                        <div style={{ ...s.chevron, transform: isOpen ? "rotate(180deg)" : "none" }}>▼</div>
                      </div>
                    </div>

                    {isOpen && (
                      <div style={s.cardActions}>
                        <div style={s.actionRow}>
                          <button style={s.logBtn} onClick={() => openLog(ex.id)}>LOG SETS</button>
                          <button style={s.histBtn} onClick={() => openHistory(ex.id)}>HISTORY</button>
                        </div>
                        
                        <div style={{ ...s.actionRow, marginTop: 8 }}>
                           {!isDone ? (
                             <button style={s.doneActionBtn} onClick={() => toggleStatus(ex.name, 'done')}>✓ DONE</button>
                           ) : (
                             <button style={s.undoActionBtn} onClick={() => toggleStatus(ex.name, 'undo')}>UNDO DONE</button>
                           )}
                        </div>

                        {editExId === ex.id && (
                          <div style={s.historyDrawer}>
                            <div style={s.historyTitle}>EXERCISE SETTINGS</div>
                            <div style={{ padding: "0 12px 12px" }}>
                              <div style={{ fontSize: 10, color: "#444", marginBottom: 4, fontFamily: "'DM Mono', monospace" }}>CATEGORY</div>
                              <select
                                id={`edit-cat-${ex.id}`}
                                defaultValue={ex.category}
                                style={{ ...s.input, marginBottom: 12, padding: "12px 16px" }}
                              >
                                {[...new Set(exercises.map(e => e.category).filter(Boolean))].sort().map(c => (
                                  <option key={c} value={c}>{c}</option>
                                ))}
                                <option value="__new__">+ Add new category...</option>
                              </select>
                              <div style={{ fontSize: 10, color: "#444", marginBottom: 4, fontFamily: "'DM Mono', monospace" }}>LOCATION</div>
                              <select 
                                id={`edit-loc-${ex.id}`}
                                defaultValue={ex.location}
                                style={{ ...s.input, marginBottom: 16, padding: "12px 16px" }}
                              >
                                {locations.map(l => <option key={l} value={l}>{l}</option>)}
                              </select>
                              <div style={{ display: "flex", gap: 8 }}>
                                <button 
                                  style={{ ...s.saveSetBtn, flex: 1, margin: 0 }}
                                  onClick={(e) => {
                                    let c = document.getElementById(`edit-cat-${ex.id}`).value;
                                    if (c === '__new__') {
                                      const typed = prompt('Enter new category name:');
                                      if (!typed || !typed.trim()) return;
                                      c = typed.trim();
                                    }
                                    const l = document.getElementById(`edit-loc-${ex.id}`).value;
                                    e.currentTarget.textContent = "Saving...";
                                    saveInlineMetadata(ex.id, c, l);
                                  }}
                                >SAVE METADATA</button>
                                <button 
                                  style={{ background: "transparent", color: "#ef4444", border: "1px solid #ef4444", borderRadius: 8, padding: "12px 16px", margin: 0, flex: "none", width: "auto", cursor: "pointer", fontWeight: 700, fontSize: 13 }} 
                                  onClick={() => setConfirmDelete({ type: "exercise", id: ex.id })}
                                >DELETE</button>
                              </div>
                            </div>
                          </div>
                        )}

                        {historyExId === ex.id && (
                          <div style={s.historyDrawer}>
                            <div style={s.historyTitle}>RECENT HISTORY</div>
                            {(ex.history || []).length === 0 ? (
                              <div style={s.emptySmall}>No entries yet</div>
                            ) : (
                              ex.history.slice(0, 10).map((h, i) => {
                                const displayName = people.find(p => p.toLowerCase() === h.person) || h.person;
                                const result = ex.timed
                                  ? h.reps + (h.weight ? ` · ${h.weight}lbs` : "")
                                  : (h.weight ? `${h.reps}x${h.weight}` : `${h.reps} reps`);
                                return (
                                  <div key={i} style={s.histRow}>
                                    <div style={{ flex: 1 }}>
                                      <div style={s.histDate}>{h.date}</div>
                                      <div style={s.histName}>{displayName.toUpperCase()}</div>
                                      {h.note && <div style={s.histNote}>{h.note}</div>}
                                    </div>
                                    <div style={s.histRight}>
                                      <div style={s.histResult}>{result}</div>
                                      <div style={s.histRange}>{ex.timed ? "⏱" : REP_RANGES.find(r => r.key === h.range)?.label}</div>
                                      <button style={s.histDel} onClick={() => deleteLog(ex.id, h)}>✕</button>
                                    </div>
                                  </div>
                                );
                              })
                            )}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>

          <button style={s.fab} onClick={() => setView("add")}>+</button>

          {confirmDelete && (
            <div style={s.overlay} onClick={() => setConfirmDelete(null)}>
              <div style={s.modal} onClick={e => e.stopPropagation()}>
                <h3 style={{ marginBottom: 12 }}>Confirm Delete</h3>
                <p style={{ color: "#666", fontSize: 14, marginBottom: 24 }}>Are you sure you want to delete this?</p>
                <div style={{ display: "flex", gap: 12 }}>
                  <button style={s.modalCancel} onClick={() => setConfirmDelete(null)}>Cancel</button>
                  <button style={s.modalDelete} onClick={() => {
                    if (confirmDelete.type === "exercise") deleteExercise(confirmDelete.id);
                    if (confirmDelete.type === "person") removePerson(confirmDelete.name);
                    if (confirmDelete.type === "location") removeLocation(confirmDelete.name);
                  }}>Delete</button>
                </div>
              </div>
            </div>
          )}

          {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
        </div>
      );
    }
