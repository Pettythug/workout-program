<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0c0c0c" />
  <title>GYM LOG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: #0c0c0c;
      overflow: hidden;
    }

    #root {
      height: 100%;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      animation: spin 0.8s linear infinite;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── PASTE YOUR APPS SCRIPT DEPLOYMENT URL HERE ──────────────────────────
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtpr_4LEVCXRyMv_v86796HIN0v36kdULk7DVSI2x3R2KIbjh9KGWFV0lXT7x8MZTo7g/exec";
    // ────────────────────────────────────────────────────────────────────────

    const STORAGE_KEY = "gym-tracker-v4";

    const REP_RANGES = [
      { key: "r1_3", label: "1-3" },
      { key: "r4_7", label: "4-7" },
      { key: "r8_12", label: "8-12" },
      { key: "r15_20", label: "15-20" },
    ];

    function getRange(reps) {
      const n = parseInt(reps);
      if (isNaN(n)) return null;
      if (n >= 1 && n <= 3) return "r1_3";
      if (n >= 4 && n <= 7) return "r4_7";
      if (n >= 8 && n <= 12) return "r8_12";
      if (n >= 15 && n <= 20) return "r15_20";
      return null;
    }

    // Compatibility shim: the v2 backend returns r13_plus instead of r15_20.
    // Remap it back to r15_20 so this legacy app displays correctly for current users.
    function remapToLegacy(range) {
      return range === "r13_plus" ? "r15_20" : range;
    }

    function todayStr() {
      return new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function parseWeight(w) {
      const n = parseFloat(String(w).replace(/[^0-9.\-]/g, ""));
      return isNaN(n) ? 0 : n;
    }

    function isBetter(newWeight, oldWeight) {
      return parseWeight(newWeight) > parseWeight(oldWeight);
    }

    function latest(reps, weight) { return { reps: String(reps), weight: String(weight) }; }
    function hist(person, reps, weight, range, note = "") {
      return { date: "Pre-loaded", person, reps: String(reps), weight: String(weight), range, note };
    }

    const INITIAL_EXERCISES = [];

    async function sheetsGet() {
      const res = await fetch(SCRIPT_URL);
      const json = await res.json();
      if (json.status !== "ok") throw new Error(json.message);
      return json.data;
    }

    async function sheetsPost(payload) {
      // Apps Script POST redirect (302) silently drops the request body.
      // Workaround: tunnel writes through GET with URL-encoded payload param.
      const encoded = encodeURIComponent(JSON.stringify(payload));
      const res = await fetch(SCRIPT_URL + '?payload=' + encoded);
      const json = await res.json();
      if (json.status !== "ok") throw new Error(json.message);
      return json.data;
    }

    function mergeFromSheets(localExercises, sheetsData) {
      const { history: allHistory, best: allBest } = sheetsData;
      return localExercises.map(ex => {
        // Remap r13_plus → r15_20 in history rows so range badges display correctly
        const sheetHistory = allHistory
          .filter(h => h.exercise === ex.name)
          .map(h => ({ ...h, range: remapToLegacy(h.range) }));
        // Remap r13_plus → r15_20 in best keys so the best grid displays correctly
        const rawBest = allBest[ex.name];
        let sheetBest = rawBest || { brian: {}, dad: {} };
        if (rawBest) {
          const remapped = {};
          for (const person of Object.keys(rawBest)) {
            remapped[person] = {};
            for (const [key, val] of Object.entries(rawBest[person] || {})) {
              remapped[person][remapToLegacy(key)] = val;
            }
          }
          sheetBest = remapped;
        }
        return {
          ...ex,
          history: sheetHistory,
          best: sheetBest,
        };
      });
    }

    function WorkoutTracker() {
      const [exercises, setExercises] = useState([]);
      const [loading, setLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState("idle");
      const [search, setSearch] = useState("");
      const [view, setView] = useState("list");
      const [expanded, setExpanded] = useState(null);
      const [toast, setToast] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [whoMode, setWhoMode] = useState("both");
      const [logExId, setLogExId] = useState(null);
      const [sets, setSets] = useState([]);
      const [brianReps, setBrianReps] = useState("");
      const [brianWeight, setBrianWeight] = useState("");
      const [dadReps, setDadReps] = useState("");
      const [dadWeight, setDadWeight] = useState("");
      const [logNote, setLogNote] = useState("");
      const [logError, setLogError] = useState("");
      const [setCount, setSetCount] = useState(1);
      const [newName, setNewName] = useState("");

      const scriptConfigured = SCRIPT_URL !== "PASTE_YOUR_DEPLOYMENT_URL_HERE";

      useEffect(() => { loadData(); }, []);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 2400);
      };

      const loadData = async () => {
        let base = INITIAL_EXERCISES;
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved)) {
            const savedIds = new Set(saved.map(e => e.id));
            const savedNames = new Set(saved.map(e => e.name.toLowerCase()));
            const newOnes = INITIAL_EXERCISES.filter(e => !savedIds.has(e.id) && !savedNames.has(e.name.toLowerCase()));
            base = [...saved, ...newOnes].map(ex => {
              if (ex.latest && !ex.best) return { ...ex, best: ex.latest };
              if (!ex.best) return { ...ex, best: { brian: {}, dad: {} } };
              return ex;
            });
          }
        } catch { }
        setExercises(base);
        setLoading(false);

        if (scriptConfigured) {
          setSyncStatus("syncing");
          try {
            const sheetsData = await sheetsGet();
            const hasData = sheetsData.history.length > 0 || Object.keys(sheetsData.best).length > 0;
            if (hasData) {
              // Dynamically add any exercises found in Sheets that aren't in the local list
              const existingNames = new Set(base.map(e => e.name.toLowerCase()));
              const sheetExerciseNames = new Set([
                ...Object.keys(sheetsData.best || {}),
                ...(sheetsData.history || []).map(h => h.exercise).filter(Boolean)
              ]);

              let nextId = Math.max(0, ...base.map(e => e.id)) + 1;
              for (const name of sheetExerciseNames) {
                if (!existingNames.has(name.toLowerCase())) {
                  base.push({ id: nextId++, name, best: { brian: {}, dad: {} }, history: [] });
                  existingNames.add(name.toLowerCase());
                }
              }

              // Sort all exercises alphabetically
              base.sort((a, b) => a.name.localeCompare(b.name));

              const merged = mergeFromSheets(base, sheetsData);
              setExercises(merged);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
            }
            setSyncStatus("ok");
          } catch {
            setSyncStatus("error");
            showToast("Sheets sync failed — working offline", "error");
          }
        }
      };

      const persist = async (data, sheetsPayload = null) => {
        setExercises(data);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        if (scriptConfigured && sheetsPayload) {
          setSyncStatus("syncing");
          try {
            await sheetsPost(sheetsPayload);
            setSyncStatus("ok");
          } catch {
            setSyncStatus("error");
            showToast("Saved locally — Sheets sync failed", "error");
          }
        }
      };

      const openLog = (id) => {
        setLogExId(id); setSets([]); setBrianReps(""); setBrianWeight("");
        setDadReps(""); setDadWeight(""); setLogNote(""); setLogError(""); setSetCount(1);
        setView("log");
      };

      const getBest = (exId, person, rangeKey) => {
        const ex = exercises.find(e => e.id === exId);
        const b = ex?.best?.[person]?.[rangeKey];
        if (!b) return null;
        return b.weight ? `${b.reps}x${b.weight}` : `${b.reps} reps`;
      };

      const saveSet = async () => {
        const brianRange = whoMode !== "dad" ? getRange(brianReps) : null;
        const dadRange = whoMode !== "brian" ? getRange(dadReps) : null;
        if (whoMode !== "dad" && !brianReps.trim()) return setLogError("Enter Brian's reps");
        if (whoMode !== "dad" && !brianRange) return setLogError("Brian's reps must fit a range: 1-3, 4-7, 8-12, or 15-20");
        if (whoMode !== "brian" && !dadReps.trim()) return setLogError("Enter Dad's reps");
        if (whoMode !== "brian" && !dadRange) return setLogError("Dad's reps must fit a range: 1-3, 4-7, 8-12, or 15-20");
        setLogError("");
        const date = todayStr();
        const newEntries = [];
        if (whoMode !== "dad") newEntries.push({ date, person: "brian", reps: brianReps, weight: brianWeight, range: brianRange, note: logNote, setNum: setCount });
        if (whoMode !== "brian") newEntries.push({ date, person: "dad", reps: dadReps, weight: dadWeight, range: dadRange, note: logNote, setNum: setCount });
        const exName = exercises.find(e => e.id === logExId)?.name;
        const updated = exercises.map(ex => {
          if (ex.id !== logExId) return ex;
          let newBest = { brian: { ...(ex.best?.brian || {}) }, dad: { ...(ex.best?.dad || {}) } };
          newEntries.forEach(entry => {
            const current = newBest[entry.person]?.[entry.range];
            if (!current || isBetter(entry.weight, current.weight))
              newBest[entry.person][entry.range] = { reps: entry.reps, weight: entry.weight };
          });
          return { ...ex, best: newBest, history: [...newEntries, ...(ex.history || [])] };
        });
        await persist(updated, { action: "logSet", exercise: exName, entries: newEntries });
        setSets([...sets, ...newEntries]);
        setBrianReps(""); setBrianWeight(""); setDadReps(""); setDadWeight(""); setLogNote("");
        setSetCount(setCount + 1);
        showToast(`Set ${setCount} saved!`);
      };

      const finishLogging = () => { setView("list"); setExpanded(logExId); };

      const deleteHistoryEntry = async (exId, histIdx) => {
        const ex = exercises.find(e => e.id === exId);
        const entry = ex?.history?.[histIdx];
        const updated = exercises.map(ex => {
          if (ex.id !== exId) return ex;
          const newHistory = (ex.history || []).filter((_, i) => i !== histIdx);
          const newBest = { brian: {}, dad: {} };
          newHistory.forEach(h => {
            const current = newBest[h.person]?.[h.range];
            if (!current || isBetter(h.weight, current.weight))
              newBest[h.person][h.range] = { reps: h.reps, weight: h.weight };
          });
          return { ...ex, best: newBest, history: newHistory };
        });
        await persist(updated, entry ? { action: "deleteHistory", exercise: ex.name, person: entry.person, reps: entry.reps, weight: entry.weight, range: entry.range } : null);
        setConfirmDelete(null);
        showToast("Entry deleted");
      };

      const deleteExercise = async (id) => {
        const ex = exercises.find(e => e.id === id);
        if (!ex) return;
        const updated = exercises.filter(e => e.id !== id);
        await persist(updated, { action: "deleteExercise", exercise: ex.name });
        setConfirmDelete(null);
        if (expanded === id) setExpanded(null);
        showToast("Deleted");
      };

      const addExercise = async () => {
        if (!newName.trim()) return showToast("Name required", "error");
        const maxId = exercises.reduce((m, e) => Math.max(m, e.id), 0);
        const updated = [...exercises, { id: maxId + 1, name: newName.trim(), best: { brian: {}, dad: {} }, history: [] }];
        await persist(updated); // Just local until a set is logged
        setNewName(""); showToast("Exercise added!"); setView("list");
      };

      const manualSync = async () => {
        setSyncStatus("syncing");
        try {
          await sheetsPost({ action: "syncAll", exercises });
          setSyncStatus("ok");
          showToast("Synced to Sheets ✓");
        } catch {
          setSyncStatus("error");
          showToast("Sync failed", "error");
        }
      };

      const filtered = exercises.filter(e => e.name.toLowerCase().includes(search.toLowerCase()));

      const syncDot = scriptConfigured ? (
        <div onClick={syncStatus === "error" ? manualSync : undefined}
          title={syncStatus === "error" ? "Tap to retry" : syncStatus === "syncing" ? "Syncing..." : "Synced"}
          style={{
            width: 8, height: 8, borderRadius: "50%", marginLeft: 8, cursor: syncStatus === "error" ? "pointer" : "default",
            background: syncStatus === "ok" ? "#22c55e" : syncStatus === "error" ? "#ef4444" : "#f97316",
            animation: syncStatus === "syncing" ? "spin 1s linear infinite" : "none", flexShrink: 0
          }} />
      ) : null;

      if (loading) return <div style={s.center}><div className="spinner" style={s.spinner} /></div>;

      if (view === "log") {
        const ex = exercises.find(e => e.id === logExId);
        const brianRange = getRange(brianReps);
        const dadRange = getRange(dadReps);
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={finishLogging}>← Done</button>
              <div style={s.headerTitle}>LOG SET {setCount}</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <div style={s.logExName}>{ex?.name}</div>
              <div style={s.whoLabel}>WHO'S WORKING OUT?</div>
              <div style={s.segmented}>
                {[["both", "Both"], ["brian", "Brian"], ["dad", "Dad"]].map(([val, label]) => (
                  <button key={val} style={{ ...s.segBtn, ...(whoMode === val ? s.segActive : {}) }} onClick={() => setWhoMode(val)}>{label}</button>
                ))}
              </div>
              {sets.length > 0 && (
                <div style={s.setsLogged}>
                  <div style={s.setsLoggedTitle}>LOGGED THIS SESSION</div>
                  {sets.map((set, i) => (
                    <div key={i} style={s.setRow}>
                      <span style={s.setNum}>Set {set.setNum}</span>
                      <span style={s.setPerson}>{set.person === "brian" ? "Brian" : "Dad"}</span>
                      <span style={s.setRange}>{REP_RANGES.find(r => r.key === set.range)?.label}</span>
                      <span style={s.setResult}>{set.weight ? `${set.reps}x${set.weight}` : `${set.reps} reps`}</span>
                    </div>
                  ))}
                </div>
              )}
              {whoMode !== "dad" && (
                <div style={s.personBlock}>
                  <div style={s.personBlockLabel}>BRIAN</div>
                  <div style={s.inlineRow}>
                    <div style={s.inlineField}>
                      <label style={s.label}>REPS</label>
                      <input style={s.input} placeholder="e.g. 8" type="number" value={brianReps} onChange={e => { setBrianReps(e.target.value); setLogError(""); }} />
                      {brianRange && <div style={s.rangeTag}>{REP_RANGES.find(r => r.key === brianRange)?.label}</div>}
                    </div>
                    <div style={s.inlineField}>
                      <label style={s.label}>WEIGHT</label>
                      <input style={s.input} placeholder="e.g. 135" value={brianWeight} onChange={e => setBrianWeight(e.target.value)} />
                      {brianRange && getBest(logExId, "brian", brianRange) && <div style={s.bestTag}>Best: {getBest(logExId, "brian", brianRange)}</div>}
                    </div>
                  </div>
                </div>
              )}
              {whoMode !== "brian" && (
                <div style={s.personBlock}>
                  <div style={s.personBlockLabel}>DAD</div>
                  <div style={s.inlineRow}>
                    <div style={s.inlineField}>
                      <label style={s.label}>REPS</label>
                      <input style={s.input} placeholder="e.g. 8" type="number" value={dadReps} onChange={e => { setDadReps(e.target.value); setLogError(""); }} />
                      {dadRange && <div style={s.rangeTag}>{REP_RANGES.find(r => r.key === dadRange)?.label}</div>}
                    </div>
                    <div style={s.inlineField}>
                      <label style={s.label}>WEIGHT</label>
                      <input style={s.input} placeholder="e.g. 95" value={dadWeight} onChange={e => setDadWeight(e.target.value)} />
                      {dadRange && getBest(logExId, "dad", dadRange) && <div style={s.bestTag}>Best: {getBest(logExId, "dad", dadRange)}</div>}
                    </div>
                  </div>
                </div>
              )}
              <div style={s.inlineField}>
                <label style={s.label}>NOTE (optional)</label>
                <input style={s.input} placeholder="e.g. felt strong, pin #7" value={logNote} onChange={e => setLogNote(e.target.value)} />
              </div>
              {logError && <div style={s.error}>{logError}</div>}
              <div style={s.logBtnRow}>
                <button style={s.saveSetBtn} onClick={saveSet}>Save Set {setCount}</button>
                {sets.length > 0 && <button style={s.doneBtn} onClick={finishLogging}>Done</button>}
              </div>
            </div>
            {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          </div>
        );
      }

      if (view === "add") {
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={() => setView("list")}>← Back</button>
              <div style={s.headerTitle}>NEW EXERCISE</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <label style={s.label}>EXERCISE NAME</label>
              <input style={s.input} placeholder="e.g. Leg Press" value={newName} autoFocus onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === "Enter" && addExercise()} />
              <button style={s.submitBtn} onClick={addExercise}>Add Exercise</button>
            </div>
            {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          </div>
        );
      }

      return (
        <div style={s.root}>
          <div style={s.header}>
            <div>
              <div style={{ display: "flex", alignItems: "center" }}>
                <div style={s.title}>GYM LOG</div>
                {syncDot}
              </div>
              <div style={s.subtitle}>Brian & Dad · {exercises.length} exercises</div>
            </div>
            <button style={s.addIconBtn} onClick={() => setView("add")}>➕</button>
          </div>
          <div style={s.searchWrap}>
            <span style={s.searchIcon}>🔍</span>
            <input style={s.searchInput} placeholder="Search exercises..." value={search} onChange={e => setSearch(e.target.value)} />
            {search && <button style={s.clearBtn} onClick={() => setSearch("")}>✕</button>}
          </div>
          {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          {confirmDelete && (
            <div style={s.overlay}>
              <div style={s.modal}>
                <div style={s.modalTitle}>{confirmDelete.type === "exercise" ? "Delete exercise?" : "Delete this entry?"}</div>
                <div style={s.modalSub}>{confirmDelete.type === "exercise" ? exercises.find(e => e.id === confirmDelete.exId)?.name : "This will be removed and best results will update."}</div>
                <div style={s.modalBtns}>
                  <button style={s.cancelBtn} onClick={() => setConfirmDelete(null)}>Cancel</button>
                  <button style={s.confirmBtn} onClick={() => confirmDelete.type === "exercise" ? deleteExercise(confirmDelete.exId) : deleteHistoryEntry(confirmDelete.exId, confirmDelete.histIdx)}>Delete</button>
                </div>
              </div>
            </div>
          )}
          <div style={s.listWrap}>
            {filtered.map(ex => {
              const isExpanded = expanded === ex.id;
              const hasData = Object.keys(ex.best?.brian || {}).length > 0 || Object.keys(ex.best?.dad || {}).length > 0;
              return (
                <div key={ex.id} style={s.card}>
                  <div style={s.cardHeader}>
                    <div style={s.cardName} onClick={() => setExpanded(isExpanded ? null : ex.id)}>
                      <span style={s.chevron}>{isExpanded ? "▾" : "▸"}</span>
                      {ex.name}
                    </div>
                    <div style={s.cardActions}>
                      <button style={s.logBtn} onClick={() => openLog(ex.id)}>+ LOG</button>
                      <button style={s.delBtn} onClick={() => setConfirmDelete({ type: "exercise", exId: ex.id })}>✕</button>
                    </div>
                  </div>
                  {hasData && (
                    <div style={s.rangeGrid}>
                      <div style={s.rangeHeaderRow}>
                        <div style={s.personCol} />
                        {REP_RANGES.map(r => <div key={r.key} style={s.rangeColHeader}>{r.label}</div>)}
                      </div>
                      {["brian", "dad"].map(person => (
                        <div key={person} style={s.rangeRow}>
                          <div style={s.personCol}>{person === "brian" ? "Brian" : "Dad"}</div>
                          {REP_RANGES.map(r => {
                            const b = ex.best?.[person]?.[r.key];
                            const val = b ? (b.weight ? `${b.reps}x${b.weight}` : `${b.reps} reps`) : null;
                            return (
                              <div key={r.key} style={{ ...s.rangeCell, ...(val ? s.rangeCellFilled : {}) }}>
                                {val || <span style={s.dash}>—</span>}
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                  )}
                  {isExpanded && (
                    <div style={s.history}>
                      {(ex.history || []).length === 0 ? (
                        <div style={s.noHistory}>No history yet. Tap + LOG to add a result.</div>
                      ) : (
                        <>
                          <div style={s.historyTitle}>HISTORY</div>
                          {(ex.history || []).map((h, i) => (
                            <div key={i} style={s.historyRow}>
                              <div style={s.historyLeft}>
                                <div style={s.historyDate}>{h.date}{h.setNum ? ` · Set ${h.setNum}` : ""}</div>
                                <div style={s.historyMeta}>
                                  <span style={s.historyPerson}>{h.person === "brian" ? "Brian" : "Dad"}</span>
                                  <span style={s.historyRange}>{REP_RANGES.find(r => r.key === h.range)?.label}</span>
                                  <span style={s.historyResult}>{h.weight ? `${h.reps}x${h.weight}` : `${h.reps} reps`}</span>
                                </div>
                                {h.note ? <div style={s.historyNote}>{h.note}</div> : null}
                              </div>
                              <button style={s.histDelBtn} onClick={() => setConfirmDelete({ type: "history", exId: ex.id, histIdx: i })}>✕</button>
                            </div>
                          ))}
                        </>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            {filtered.length === 0 && <div style={s.noResults}>{search ? `No results for "${search}"` : "No exercises yet"}</div>}
          </div>
        </div>
      );
