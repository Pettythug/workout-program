<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0c0c0c" />
  <title>GYM LOG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0c0c0c; overflow: hidden; }
    #root { height: 100%; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── PASTE YOUR APPS SCRIPT DEPLOYMENT URL HERE ──────────────────────────
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtpr_4LEVCXRyMv_v86796HIN0v36kdULk7DVSI2x3R2KIbjh9KGWFV0lXT7x8MZTo7g/exec";
    // ────────────────────────────────────────────────────────────────────────

    const STORAGE_KEY  = "gym-tracker-v4";      // reuse existing exercise cache
    const PEOPLE_KEY   = "gym-tracker-people-v1"; // separate people roster cache
    const DEFAULT_PEOPLE = ["Brian", "Dad"];

    const EXERCISE_CATEGORIES = [
      "Explosive",
      "Knee Dominant",
      "Hip Dominant",
      "Horizontal Push",
      "Horizontal Pull",
      "Vertical Push",
      "Vertical Pull",
      "Rotational Core",
      "Plank Core",
      "Accessory",
    ];

    // ── REP RANGES (15-20 replaced by 13+) ───────────────────────────────────
    const REP_RANGES = [
      { key: "r1_3",     label: "1-3"  },
      { key: "r4_7",     label: "4-7"  },
      { key: "r8_12",    label: "8-12" },
      { key: "r13_plus", label: "13+"  },
    ];

    // Maps a rep count to its bucket key
    function getRange(reps) {
      const n = parseInt(reps);
      if (isNaN(n)) return null;
      if (n >= 1  && n <= 3)  return "r1_3";
      if (n >= 4  && n <= 7)  return "r4_7";
      if (n >= 8  && n <= 12) return "r8_12";
      if (n >= 13)            return "r13_plus";
      return null;
    }

    // ── TIME UTILITIES ────────────────────────────────────────────────────────
    // Parse "1:30" or "90" → total seconds
    function parseTime(val) {
      const str = String(val || "").trim();
      if (!str) return 0;
      if (str.includes(":")) {
        const [m, s] = str.split(":");
        return (parseInt(m) || 0) * 60 + (parseInt(s) || 0);
      }
      return parseInt(str) || 0;
    }

    // Format total seconds → "m:ss"
    function formatTime(totalSeconds) {
      const s = Math.max(0, parseInt(totalSeconds) || 0);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    // If user typed plain seconds (e.g. "90"), convert to "1:30"; otherwise leave as-is
    function normalizeTimeInput(val) {
      const str = String(val || "").trim();
      if (!str) return str;
      if (/^\d+$/.test(str)) return formatTime(parseInt(str));
      return str;
    }

    function todayStr() {
      return new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function parseWeight(w) {
      const n = parseFloat(String(w).replace(/[^0-9.\-]/g, ""));
      return isNaN(n) ? 0 : n;
    }

    // Determine if a new entry beats the stored best
    function isBetter(newEntry, oldEntry, timed) {
      if (timed) return parseTime(newEntry.reps) > parseTime(oldEntry?.reps || "0:00");
      return parseWeight(newEntry.weight) > parseWeight(oldEntry?.weight || 0);
    }

    // ── MIGRATION: r15_20 → r13_plus ─────────────────────────────────────────
    function migrateRanges(exercises) {
      return exercises.map(ex => {
        // Migrate best records
        const newBest = {};
        for (const person of Object.keys(ex.best || {})) {
          newBest[person] = {};
          for (const [key, val] of Object.entries(ex.best[person] || {})) {
            const nk = key === "r15_20" ? "r13_plus" : key;
            // Keep whichever is heavier if both exist
            if (!newBest[person][nk] || parseWeight(val?.weight) > parseWeight(newBest[person][nk]?.weight)) {
              newBest[person][nk] = val;
            }
          }
        }
        // Migrate history rows
        const newHistory = (ex.history || []).map(h =>
          h.range === "r15_20" ? { ...h, range: "r13_plus" } : h
        );
        return { ...ex, best: newBest, history: newHistory };
      });
    }

    // ── SHEETS API ────────────────────────────────────────────────────────────
    async function sheetsGet() {
      const res  = await fetch(SCRIPT_URL);
      const json = await res.json();
      if (json.status !== "ok") throw new Error(json.message);
      return json.data;
    }

    async function sheetsPost(payload) {
      const encoded = encodeURIComponent(JSON.stringify(payload));
      const res  = await fetch(SCRIPT_URL + "?payload=" + encoded);
      const json = await res.json();
      if (json.status !== "ok") throw new Error(json.message);
      return json.data;
    }

    // Merge Sheets data into local exercises; also pick up people roster from Sheets
    function mergeFromSheets(localExercises, sheetsData, localPeople) {
      const { history: allHistory, best: allBest, people: sheetPeople, exercises: sheetExercises } = sheetsData;
      const people = (sheetPeople && sheetPeople.length > 0) ? sheetPeople : localPeople;

      const makeBest = () => {
        const b = {};
        people.forEach(p => { b[p.toLowerCase()] = {}; });
        return b;
      };

      const merged = localExercises.map(ex => {
        const sheetHistory = allHistory.filter(h => h.exercise === ex.name);
        const sheetBest    = allBest[ex.name];
        const sheetExInfo  = (sheetExercises || []).find(e => e.name === ex.name);
        return {
          ...ex,
          timed:    sheetExInfo?.timed    ?? ex.timed    ?? false,
          category: sheetExInfo?.category ?? ex.category ?? "",
          history:  sheetHistory,
          best:     sheetBest || makeBest(),
        };
      });

      return { exercises: merged, people };
    }

    // ── MAIN COMPONENT ────────────────────────────────────────────────────────
    function WorkoutTracker() {
      const [exercises,     setExercises]     = useState([]);
      const [people,        setPeople]        = useState(DEFAULT_PEOPLE);
      const [loading,       setLoading]       = useState(true);
      const [syncStatus,    setSyncStatus]    = useState("idle");
      const [search,        setSearch]        = useState("");
      const [view,          setView]          = useState("list");
      const [expanded,      setExpanded]      = useState(null);
      const [toast,         setToast]         = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [whoMode,       setWhoMode]       = useState("all");
      const [logExId,       setLogExId]       = useState(null);
      const [sets,          setSets]          = useState([]);
      const [logInputs,     setLogInputs]     = useState({});   // keyed by person.toLowerCase()
      const [logNote,       setLogNote]       = useState("");
      const [logError,      setLogError]      = useState("");
      const [setCount,      setSetCount]      = useState(1);
      const [newName,       setNewName]       = useState("");
      const [newExTimed,    setNewExTimed]    = useState(false);
      const [newExCategory, setNewExCategory] = useState("");
      const [newPersonName, setNewPersonName] = useState("");
      const [lastSyncTime,  setLastSyncTime]  = useState(null);

      const scriptConfigured = SCRIPT_URL !== "PASTE_YOUR_DEPLOYMENT_URL_HERE";

      useEffect(() => { loadData(); }, []);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 2400);
      };

      // ── LOAD ───────────────────────────────────────────────────────────────
      const loadData = async () => {
        // Step 1: read people from localStorage
        let localPeople = DEFAULT_PEOPLE;
        try {
          const sp = JSON.parse(localStorage.getItem(PEOPLE_KEY));
          if (sp && Array.isArray(sp) && sp.length > 0) localPeople = sp;
        } catch {}

        // Step 2: read exercises from localStorage
        let base = [];
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved)) {
            base = saved.map(ex => {
              if (!ex.best) {
                const b = {};
                localPeople.forEach(p => { b[p.toLowerCase()] = {}; });
                return { ...ex, timed: ex.timed ?? false, category: ex.category || "", best: b };
              }
              return { ...ex, timed: ex.timed ?? false, category: ex.category || "" };
            });
          }
        } catch {}

        base = migrateRanges(base);
        setPeople(localPeople);
        setExercises(base);
        setLoading(false);

        // Step 3: sync from Sheets
        if (scriptConfigured) {
          setSyncStatus("syncing");
          try {
            const sheetsData = await sheetsGet();
            const hasData = sheetsData.history.length > 0 || Object.keys(sheetsData.best).length > 0;
            if (hasData) {
              // Add exercises in Sheets that aren't local
              const existingNames = new Set(base.map(e => e.name.toLowerCase()));
              const sheetNames = new Set([
                ...Object.keys(sheetsData.best || {}),
                ...(sheetsData.history || []).map(h => h.exercise).filter(Boolean),
              ]);
              let nextId = Math.max(0, ...base.map(e => e.id), 0) + 1;
              for (const name of sheetNames) {
                if (!existingNames.has(name.toLowerCase())) {
                  const defBest = {};
                  localPeople.forEach(p => { defBest[p.toLowerCase()] = {}; });
                  base.push({ id: nextId++, name, timed: false, category: "", best: defBest, history: [] });
                  existingNames.add(name.toLowerCase());
                }
              }
              base.sort((a, b) => a.name.localeCompare(b.name));

              const { exercises: merged, people: mergedPeople } = mergeFromSheets(base, sheetsData, localPeople);
              const migrated = migrateRanges(merged);

              setPeople(mergedPeople);
              setExercises(migrated);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
              localStorage.setItem(PEOPLE_KEY, JSON.stringify(mergedPeople));
            }
            setSyncStatus("ok");
            setLastSyncTime(new Date());
          } catch {
            setSyncStatus("error");
            showToast("Sheets sync failed — working offline", "error");
          }
        }
      };

      // ── PERSIST ────────────────────────────────────────────────────────────
      const persist = async (newExercises, newPeople = null, sheetsPayload = null) => {
        setExercises(newExercises);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(newExercises));
        if (newPeople) {
          setPeople(newPeople);
          localStorage.setItem(PEOPLE_KEY, JSON.stringify(newPeople));
        }
        if (scriptConfigured && sheetsPayload) {
          setSyncStatus("syncing");
          try {
            await sheetsPost(sheetsPayload);
            setSyncStatus("ok");
          } catch {
            setSyncStatus("error");
            showToast("Saved locally — Sheets sync failed", "error");
          }
        }
      };

      // People currently being tracked in the log screen
      const activePeople = whoMode === "all" ? people : [people.find(p => p === whoMode)].filter(Boolean);

      // ── LOG SCREEN HELPERS ─────────────────────────────────────────────────
      const openLog = (id) => {
        setLogExId(id);
        setSets([]);
        const inputs = {};
        people.forEach(p => { inputs[p.toLowerCase()] = { reps: "", weight: "", duration: "" }; });
        setLogInputs(inputs);
        setLogNote("");
        setLogError("");
        setSetCount(1);
        setView("log");
      };

      const updateLogInput = (personKey, field, value) => {
        setLogInputs(prev => ({ ...prev, [personKey]: { ...prev[personKey], [field]: value } }));
        setLogError("");
      };

      const getBest = (exId, personKey, rangeKey) => {
        const ex = exercises.find(e => e.id === exId);
        const b  = ex?.best?.[personKey]?.[rangeKey];
        if (!b) return null;
        if (ex.timed) return b.reps;  // already mm:ss
        return b.weight ? `${b.reps}x${b.weight}` : `${b.reps} reps`;
      };

      // ── SAVE SET ──────────────────────────────────────────────────────────
      const saveSet = async () => {
        const ex = exercises.find(e => e.id === logExId);
        const date = todayStr();
        const newEntries = [];
        let err = "";

        for (const person of activePeople) {
          const key   = person.toLowerCase();
          const input = logInputs[key] || {};

          if (ex.timed) {
            const rawDur = input.duration?.trim();
            if (!rawDur) { err = `Enter ${person}'s duration`; break; }
            const normalized = normalizeTimeInput(rawDur);
            if (parseTime(normalized) <= 0) { err = `Invalid duration for ${person} — use mm:ss or seconds`; break; }
            newEntries.push({
              date, person: key, reps: normalized, weight: input.weight || "",
              range: "r13_plus", note: logNote, setNum: setCount, timed: true,
            });
          } else {
            const repsVal = input.reps?.trim();
            if (!repsVal) { err = `Enter ${person}'s reps`; break; }
            const range = getRange(repsVal);
            if (!range) { err = `${person}'s reps must fit a range: 1-3, 4-7, 8-12, or 13+`; break; }
            newEntries.push({
              date, person: key, reps: repsVal, weight: input.weight || "",
              range, note: logNote, setNum: setCount, timed: false,
            });
          }
        }

        if (err) return setLogError(err);
        setLogError("");

        const exName = ex.name;
        const updated = exercises.map(ex => {
          if (ex.id !== logExId) return ex;
          // Clone best for all people
          const newBest = {};
          people.forEach(p => { newBest[p.toLowerCase()] = { ...(ex.best?.[p.toLowerCase()] || {}) }; });
          newEntries.forEach(entry => {
            const current = newBest[entry.person]?.[entry.range];
            if (!current || isBetter(entry, current, ex.timed))
              newBest[entry.person][entry.range] = { reps: entry.reps, weight: entry.weight };
          });
          return { ...ex, best: newBest, history: [...newEntries, ...(ex.history || [])] };
        });

        await persist(updated, null, { action: "logSet", exercise: exName, entries: newEntries });
        setSets([...sets, ...newEntries]);
        const inputs = {};
        people.forEach(p => { inputs[p.toLowerCase()] = { reps: "", weight: "", duration: "" }; });
        setLogInputs(inputs);
        setLogNote("");
        setSetCount(setCount + 1);
        showToast(`Set ${setCount} saved!`);
      };

      const finishLogging = () => { setView("list"); setExpanded(logExId); };

      // ── DELETE HELPERS ─────────────────────────────────────────────────────
      const deleteHistoryEntry = async (exId, histIdx) => {
        const ex    = exercises.find(e => e.id === exId);
        const entry = ex?.history?.[histIdx];
        const updated = exercises.map(ex => {
          if (ex.id !== exId) return ex;
          const newHistory = (ex.history || []).filter((_, i) => i !== histIdx);
          const newBest = {};
          people.forEach(p => { newBest[p.toLowerCase()] = {}; });
          newHistory.forEach(h => {
            const current = newBest[h.person]?.[h.range];
            if (!current || isBetter(h, current, ex.timed))
              newBest[h.person][h.range] = { reps: h.reps, weight: h.weight };
          });
          return { ...ex, best: newBest, history: newHistory };
        });
        await persist(updated, null, entry ? {
          action: "deleteHistory", exercise: ex.name,
          person: entry.person, reps: entry.reps, weight: entry.weight, range: entry.range,
        } : null);
        setConfirmDelete(null);
        showToast("Entry deleted");
      };

      const deleteExercise = async (id) => {
        const ex = exercises.find(e => e.id === id);
        if (!ex) return;
        const updated = exercises.filter(e => e.id !== id);
        await persist(updated, null, { action: "deleteExercise", exercise: ex.name });
        setConfirmDelete(null);
        if (expanded === id) setExpanded(null);
        showToast("Deleted");
      };

      // ── ADD EXERCISE ───────────────────────────────────────────────────────
      const addExercise = async () => {
        if (!newName.trim()) return showToast("Name required", "error");
        const maxId = exercises.reduce((m, e) => Math.max(m, e.id), 0);
        const defBest = {};
        people.forEach(p => { defBest[p.toLowerCase()] = {}; });
        const newEx = {
          id: maxId + 1, name: newName.trim(), timed: newExTimed,
          category: newExCategory, best: defBest, history: [],
        };
        const updated = [...exercises, newEx].sort((a, b) => a.name.localeCompare(b.name));
        await persist(updated);
        // Save exercise metadata to Sheets (timed flag + category)
        if (scriptConfigured) {
          try {
            await sheetsPost({ action: "saveExercise", exercise: newEx.name, timed: newEx.timed, category: newEx.category });
          } catch { /* non-critical — metadata syncs on next syncAll */ }
        }
        setNewName(""); setNewExTimed(false); setNewExCategory("");
        showToast("Exercise added!");
        setView("list");
      };

      // ── PEOPLE MANAGEMENT ──────────────────────────────────────────────────
      const addPerson = async () => {
        if (!newPersonName.trim()) return showToast("Name required", "error");
        const trimmed = newPersonName.trim();
        if (people.map(p => p.toLowerCase()).includes(trimmed.toLowerCase()))
          return showToast("Already on the list", "error");
        const newPeople = [...people, trimmed];
        // Ensure all exercises have a best slot for this person
        const updatedEx = exercises.map(ex => {
          const nb = { ...(ex.best || {}) };
          nb[trimmed.toLowerCase()] = {};
          return { ...ex, best: nb };
        });
        await persist(updatedEx, newPeople, { action: "savePeople", people: newPeople });
        setNewPersonName("");
        showToast(`${trimmed} added!`);
      };

      const removePerson = async (name) => {
        if (people.length <= 1) return showToast("Need at least one person", "error");
        const newPeople = people.filter(p => p !== name);
        await persist(exercises, newPeople, { action: "savePeople", people: newPeople });
        // Reset whoMode if it was set to the removed person
        if (whoMode === name) setWhoMode("all");
        setConfirmDelete(null);
        showToast(`${name} removed from roster`);
      };

      // ── MANUAL SYNC ────────────────────────────────────────────────────────
      const manualSync = async () => {
        if (syncStatus === "syncing") return;
        setSyncStatus("syncing");
        try {
          const exMeta = exercises.map(ex => ({ name: ex.name, timed: ex.timed, category: ex.category || "" }));
          await sheetsPost({ action: "syncMeta", people, exercises: exMeta });
          setSyncStatus("ok");
          setLastSyncTime(new Date());
          showToast("Synced to Sheets ✓");
        } catch (e) {
          setSyncStatus("error");
          showToast("Sync failed: " + (e?.message || "unknown error"), "error");
        }
      };

      const filtered = exercises.filter(e => e.name.toLowerCase().includes(search.toLowerCase()));

      const syncDot = scriptConfigured ? (
        <div
          title={syncStatus === "error" ? "Sync error — go to Settings to retry" : syncStatus === "syncing" ? "Syncing..." : "Synced"}
          style={{
            width: 8, height: 8, borderRadius: "50%", marginLeft: 8,
            cursor: "default",
            background: syncStatus === "ok" ? "#22c55e" : syncStatus === "error" ? "#ef4444" : "#f97316",
            animation: syncStatus === "syncing" ? "spin 1s linear infinite" : "none", flexShrink: 0,
          }}
        />
      ) : null;

      if (loading) return <div style={s.center}><div className="spinner" style={s.spinner} /></div>;

      // ════════════════════════════════════════════════════════════════════════
      // SETTINGS VIEW
      // ════════════════════════════════════════════════════════════════════════
      if (view === "settings") {
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={() => setView("list")}>← Back</button>
              <div style={s.headerTitle}>SETTINGS</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <div style={s.sectionLabel}>PEOPLE</div>
              <div style={s.settingsNote}>
                Removing a person hides them from the workout selector. Their history stays in Sheets.
              </div>
              {people.map(person => (
                <div key={person} style={s.personListRow}>
                  <div style={s.personListName}>{person}</div>
                  <button style={s.personRemoveBtn}
                    onClick={() => setConfirmDelete({ type: "person", name: person })}>✕</button>
                </div>
              ))}
              <div style={s.addPersonRow}>
                <input
                  style={{ ...s.input, flex: 1 }}
                  placeholder="New person name..."
                  value={newPersonName}
                  onChange={e => setNewPersonName(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && addPerson()}
                />
                <button style={s.addPersonBtn} onClick={addPerson}>ADD</button>
              </div>

              <div style={{ ...s.sectionLabel, marginTop: 24 }}>DATA</div>
              <div style={s.settingsNote}>
                Pushes all exercises, history, and people to Google Sheets. Use this after adding
                categories to existing exercises or after restoring from a new device.
              </div>
              <button
                style={{ ...s.syncBtn, ...(syncStatus === "syncing" ? s.syncBtnDisabled : {}) }}
                onClick={syncStatus !== "syncing" ? manualSync : undefined}
              >
                {syncStatus === "syncing" ? "●●● Syncing..." : "↑ Sync All Data to Sheets"}
              </button>
              {lastSyncTime && (
                <div style={{ ...s.settingsNote, marginTop: 6 }}>
                  Last synced: {lastSyncTime.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}
                </div>
              )}
            </div>

            {confirmDelete?.type === "person" && (
              <div style={s.overlay}>
                <div style={s.modal}>
                  <div style={s.modalTitle}>Remove {confirmDelete.name}?</div>
                  <div style={s.modalSub}>
                    They'll be hidden from the workout selector. All their results stay in Sheets.
                  </div>
                  <div style={s.modalBtns}>
                    <button style={s.cancelBtn} onClick={() => setConfirmDelete(null)}>Cancel</button>
                    <button style={s.confirmBtn} onClick={() => removePerson(confirmDelete.name)}>Remove</button>
                  </div>
                </div>
              </div>
            )}
            {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════
      // LOG SET VIEW
      // ════════════════════════════════════════════════════════════════════════
      if (view === "log") {
        const ex = exercises.find(e => e.id === logExId);
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={finishLogging}>← Done</button>
              <div style={s.headerTitle}>LOG SET {setCount}</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={s.logExName}>{ex?.name}</div>
                {ex?.timed && <span style={s.timedBadge}>⏱ TIMED</span>}
              </div>

              <div style={s.whoLabel}>WHO'S WORKING OUT?</div>
              <div style={s.segmented}>
                {people.length > 1 && (
                  <button style={{ ...s.segBtn, ...(whoMode === "all" ? s.segActive : {}) }}
                    onClick={() => setWhoMode("all")}>All</button>
                )}
                {people.map(p => (
                  <button key={p}
                    style={{ ...s.segBtn, ...(whoMode === p ? s.segActive : {}) }}
                    onClick={() => setWhoMode(p)}>{p}</button>
                ))}
              </div>

              {sets.length > 0 && (
                <div style={s.setsLogged}>
                  <div style={s.setsLoggedTitle}>LOGGED THIS SESSION</div>
                  {sets.map((set, i) => {
                    const displayName = people.find(p => p.toLowerCase() === set.person) || set.person;
                    const result = set.timed
                      ? set.reps + (set.weight ? ` · ${set.weight}lbs` : "")
                      : (set.weight ? `${set.reps}x${set.weight}` : `${set.reps} reps`);
                    return (
                      <div key={i} style={s.setRow}>
                        <span style={s.setNum}>Set {set.setNum}</span>
                        <span style={s.setPerson}>{displayName}</span>
                        <span style={s.setRange}>{set.timed ? "⏱" : REP_RANGES.find(r => r.key === set.range)?.label}</span>
                        <span style={s.setResult}>{result}</span>
                      </div>
                    );
                  })}
                </div>
              )}

              {activePeople.map(person => {
                const key      = person.toLowerCase();
                const input    = logInputs[key] || {};
                const rangeKey = ex?.timed ? "r13_plus" : getRange(input.reps);
                const bestVal  = getBest(logExId, key, rangeKey || "r13_plus");
                return (
                  <div key={person} style={s.personBlock}>
                    <div style={s.personBlockLabel}>{person.toUpperCase()}</div>
                    <div style={s.inlineRow}>
                      {ex?.timed ? (
                        <div style={s.inlineField}>
                          <label style={s.label}>DURATION (mm:ss)</label>
                          <input
                            style={s.input}
                            placeholder="e.g. 1:30 or 90"
                            value={input.duration || ""}
                            onChange={e => updateLogInput(key, "duration", e.target.value)}
                          />
                          {input.duration && (
                            <div style={s.rangeTag}>⏱ {normalizeTimeInput(input.duration)}</div>
                          )}
                        </div>
                      ) : (
                        <div style={s.inlineField}>
                          <label style={s.label}>REPS</label>
                          <input
                            style={s.input}
                            placeholder="e.g. 8"
                            type="number"
                            value={input.reps || ""}
                            onChange={e => updateLogInput(key, "reps", e.target.value)}
                          />
                          {rangeKey && <div style={s.rangeTag}>{REP_RANGES.find(r => r.key === rangeKey)?.label}</div>}
                        </div>
                      )}
                      <div style={s.inlineField}>
                        <label style={s.label}>WEIGHT</label>
                        <input
                          style={s.input}
                          placeholder={ex?.timed ? "lbs (optional)" : "e.g. 135"}
                          value={input.weight || ""}
                          onChange={e => updateLogInput(key, "weight", e.target.value)}
                        />
                        {rangeKey && bestVal && <div style={s.bestTag}>Best: {bestVal}</div>}
                      </div>
                    </div>
                  </div>
                );
              })}

              <div style={s.inlineField}>
                <label style={s.label}>NOTE (optional)</label>
                <input
                  style={s.input}
                  placeholder="e.g. felt strong, pin #7"
                  value={logNote}
                  onChange={e => setLogNote(e.target.value)}
                />
              </div>
              {logError && <div style={s.error}>{logError}</div>}
              <div style={s.logBtnRow}>
                <button style={s.saveSetBtn} onClick={saveSet}>Save Set {setCount}</button>
                {sets.length > 0 && <button style={s.doneBtn} onClick={finishLogging}>Done</button>}
              </div>
            </div>
            {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════
      // ADD EXERCISE VIEW
      // ════════════════════════════════════════════════════════════════════════
      if (view === "add") {
        return (
          <div style={s.root}>
            <div style={s.header}>
              <button style={s.backBtn} onClick={() => setView("list")}>← Back</button>
              <div style={s.headerTitle}>NEW EXERCISE</div>
              <div style={{ width: 60 }} />
            </div>
            <div style={s.formWrap}>
              <label style={s.label}>EXERCISE NAME</label>
              <input
                style={s.input}
                placeholder="e.g. Plank"
                value={newName}
                autoFocus
                onChange={e => setNewName(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addExercise()}
              />
              <div style={s.whoLabel}>TRACKING TYPE</div>
              <div style={s.segmented}>
                <button style={{ ...s.segBtn, ...(!newExTimed ? s.segActive : {}) }}
                  onClick={() => setNewExTimed(false)}>REPS</button>
                <button style={{ ...s.segBtn, ...(newExTimed ? s.segActive : {}) }}
                  onClick={() => setNewExTimed(true)}>⏱ TIME</button>
              </div>
              {newExTimed && (
                <div style={s.timedNote}>
                  Duration logged in mm:ss. Stored in the 13+ bucket. Best = longest hold.
                  Tip: you can type plain seconds (e.g. 90) and it'll convert to 1:30.
                </div>
              )}
              <div style={s.whoLabel}>CATEGORY (optional)</div>
              <select
                style={{ ...s.input, color: newExCategory ? "#ddd" : "#555" }}
                value={newExCategory}
                onChange={e => setNewExCategory(e.target.value)}
              >
                <option value="">-- None --</option>
                {EXERCISE_CATEGORIES.map(cat => (
                  <option key={cat} value={cat}>{cat}</option>
                ))}
              </select>
              <button style={s.submitBtn} onClick={addExercise}>Add Exercise</button>
            </div>
            {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════════════
      // MAIN LIST VIEW
      // ════════════════════════════════════════════════════════════════════════
      return (
        <div style={s.root}>
          <div style={s.header}>
            <div>
              <div style={{ display: "flex", alignItems: "center" }}>
                <div style={s.title}>GYM LOG</div>
                {syncDot}
              </div>
              <div style={s.subtitle}>{people.join(" & ")} · {exercises.length} exercises</div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={s.addIconBtn} onClick={() => setView("settings")} title="Settings">⚙️</button>
              <button style={s.addIconBtn} onClick={() => setView("add")}>➕</button>
            </div>
          </div>

          <div style={s.searchWrap}>
            <span style={s.searchIcon}>🔍</span>
            <input
              style={s.searchInput}
              placeholder="Search exercises..."
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
            {search && <button style={s.clearBtn} onClick={() => setSearch("")}>✕</button>}
          </div>

          {toast && <div style={{ ...s.toast, background: toast.type === "error" ? "#ef4444" : "#22c55e" }}>{toast.msg}</div>}

          {/* Delete confirm modal (exercise or history) */}
          {confirmDelete && confirmDelete.type !== "person" && (
            <div style={s.overlay}>
              <div style={s.modal}>
                <div style={s.modalTitle}>
                  {confirmDelete.type === "exercise" ? "Delete exercise?" : "Delete this entry?"}
                </div>
                <div style={s.modalSub}>
                  {confirmDelete.type === "exercise"
                    ? exercises.find(e => e.id === confirmDelete.exId)?.name
                    : "This will be removed and best results will update."}
                </div>
                <div style={s.modalBtns}>
                  <button style={s.cancelBtn} onClick={() => setConfirmDelete(null)}>Cancel</button>
                  <button style={s.confirmBtn} onClick={() =>
                    confirmDelete.type === "exercise"
                      ? deleteExercise(confirmDelete.exId)
                      : deleteHistoryEntry(confirmDelete.exId, confirmDelete.histIdx)
                  }>Delete</button>
                </div>
              </div>
            </div>
          )}

          <div style={s.listWrap}>
            {filtered.map(ex => {
              const isExpanded = expanded === ex.id;
              const hasData = people.some(p => Object.keys(ex.best?.[p.toLowerCase()] || {}).length > 0);
              return (
                <div key={ex.id} style={s.card}>
                  <div style={s.cardHeader}>
                    <div style={s.cardName} onClick={() => setExpanded(isExpanded ? null : ex.id)}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={s.chevron}>{isExpanded ? "▾" : "▸"}</span>
                        {ex.name}
                        {ex.timed && <span style={s.timedPill}>⏱</span>}
                      </div>
                      {ex.category && <div style={s.categoryLabel}>{ex.category.toUpperCase()}</div>}
                    </div>
                    <div style={s.cardActions}>
                      <button style={s.logBtn} onClick={() => openLog(ex.id)}>+ LOG</button>
                      <button style={s.delBtn} onClick={() => setConfirmDelete({ type: "exercise", exId: ex.id })}>✕</button>
                    </div>
                  </div>

                  {/* Best results grid */}
                  {hasData && (
                    <div style={s.rangeGrid}>
                      {ex.timed ? (
                        /* Timed: single "Best Duration" column */
                        <div>
                          <div style={s.rangeHeaderRow}>
                            <div style={s.personCol} />
                            <div style={{ ...s.rangeColHeader, flex: 2, textAlign: "left" }}>BEST DURATION</div>
                            <div style={s.rangeColHeader}>WEIGHT</div>
                          </div>
                          {people.map(person => {
                            const b = ex.best?.[person.toLowerCase()]?.["r13_plus"];
                            return (
                              <div key={person} style={s.rangeRow}>
                                <div style={s.personCol}>{person}</div>
                                <div style={{ ...s.rangeCell, flex: 2, ...(b ? s.rangeCellFilled : {}), textAlign: "left" }}>
                                  {b ? b.reps : <span style={s.dash}>—</span>}
                                </div>
                                <div style={{ ...s.rangeCell, ...(b?.weight ? s.rangeCellFilled : {}) }}>
                                  {b?.weight || <span style={s.dash}>—</span>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        /* Reps: full 4-column range grid */
                        <div>
                          <div style={s.rangeHeaderRow}>
                            <div style={s.personCol} />
                            {REP_RANGES.map(r => <div key={r.key} style={s.rangeColHeader}>{r.label}</div>)}
                          </div>
                          {people.map(person => (
                            <div key={person} style={s.rangeRow}>
                              <div style={s.personCol}>{person}</div>
                              {REP_RANGES.map(r => {
                                const b   = ex.best?.[person.toLowerCase()]?.[r.key];
                                const val = b ? (b.weight ? `${b.reps}x${b.weight}` : `${b.reps} reps`) : null;
                                return (
                                  <div key={r.key} style={{ ...s.rangeCell, ...(val ? s.rangeCellFilled : {}) }}>
                                    {val || <span style={s.dash}>—</span>}
                                  </div>
                                );
                              })}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* History */}
                  {isExpanded && (
                    <div style={s.history}>
                      {(ex.history || []).length === 0 ? (
                        <div style={s.noHistory}>No history yet. Tap + LOG to add a result.</div>
                      ) : (
                        <>
                          <div style={s.historyTitle}>HISTORY</div>
                          {(ex.history || []).map((h, i) => {
                            const displayName = people.find(p => p.toLowerCase() === h.person) || h.person;
                            const result = h.timed
                              ? h.reps + (h.weight ? ` · ${h.weight}lbs` : "")
                              : (h.weight ? `${h.reps}x${h.weight}` : `${h.reps} reps`);
                            return (
                              <div key={i} style={s.historyRow}>
                                <div style={s.historyLeft}>
                                  <div style={s.historyDate}>{h.date}{h.setNum ? ` · Set ${h.setNum}` : ""}</div>
                                  <div style={s.historyMeta}>
                                    <span style={s.historyPerson}>{displayName}</span>
                                    <span style={s.historyRange}>
                                      {h.timed ? "⏱" : REP_RANGES.find(r => r.key === h.range)?.label}
                                    </span>
                                    <span style={s.historyResult}>{result}</span>
                                  </div>
                                  {h.note ? <div style={s.historyNote}>{h.note}</div> : null}
                                </div>
                                <button style={s.histDelBtn}
                                  onClick={() => setConfirmDelete({ type: "history", exId: ex.id, histIdx: i })}>✕</button>
                              </div>
                            );
                          })}
                        </>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            {filtered.length === 0 && (
              <div style={s.noResults}>{search ? `No results for "${search}"` : "No exercises yet"}</div>
            )}
          </div>
        </div>
      );
    }

    // ── STYLES ────────────────────────────────────────────────────────────────
    const s = {
      root:             { background: "#0c0c0c", height: "100dvh", fontFamily: "'DM Mono','Courier New',monospace", color: "#ddd", display: "flex", flexDirection: "column", overflow: "hidden" },
      center:           { background: "#0c0c0c", height: "100dvh", display: "flex", alignItems: "center", justifyContent: "center" },
      spinner:          { width: 24, height: 24, border: "2px solid #222", borderTop: "2px solid #f97316", borderRadius: "50%" },
      header:           { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "18px 16px 12px", borderBottom: "1px solid #1a1a1a", flexShrink: 0 },
      title:            { fontSize: 20, fontWeight: 700, letterSpacing: 5, color: "#f97316" },
      subtitle:         { fontSize: 10, color: "#444", letterSpacing: 2, marginTop: 3 },
      headerTitle:      { fontSize: 13, fontWeight: 700, letterSpacing: 3, color: "#f97316", flex: 1, textAlign: "center" },
      addIconBtn:       { background: "#111", border: "1px solid #1e1e1e", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontSize: 15 },
      backBtn:          { background: "transparent", border: "none", color: "#f97316", cursor: "pointer", fontSize: 12, fontFamily: "'DM Mono',monospace", letterSpacing: 1, width: 60, textAlign: "left" },
      searchWrap:       { display: "flex", alignItems: "center", margin: "10px 12px 6px", background: "#111", border: "1px solid #1e1e1e", borderRadius: 8, padding: "0 10px", flexShrink: 0 },
      searchIcon:       { fontSize: 12, marginRight: 6 },
      searchInput:      { flex: 1, background: "transparent", border: "none", outline: "none", color: "#ddd", fontFamily: "'DM Mono',monospace", fontSize: 12, padding: "10px 0" },
      clearBtn:         { background: "transparent", border: "none", color: "#444", cursor: "pointer", fontSize: 12 },
      toast:            { position: "fixed", top: 14, left: "50%", transform: "translateX(-50%)", padding: "7px 18px", borderRadius: 20, fontSize: 11, fontWeight: 700, color: "#fff", zIndex: 999, letterSpacing: 1 },
      overlay:          { position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 },
      modal:            { background: "#141414", border: "1px solid #2a2a2a", borderRadius: 12, padding: 24, width: 290 },
      modalTitle:       { fontSize: 14, fontWeight: 700, color: "#f97316", marginBottom: 8, letterSpacing: 1 },
      modalSub:         { fontSize: 11, color: "#666", marginBottom: 20, lineHeight: 1.5 },
      modalBtns:        { display: "flex", gap: 10 },
      cancelBtn:        { flex: 1, padding: 10, background: "#1e1e1e", border: "none", borderRadius: 8, color: "#aaa", cursor: "pointer", fontFamily: "'DM Mono',monospace", fontSize: 12 },
      confirmBtn:       { flex: 1, padding: 10, background: "#ef4444", border: "none", borderRadius: 8, color: "#fff", cursor: "pointer", fontFamily: "'DM Mono',monospace", fontSize: 12, fontWeight: 700 },
      listWrap:         { flex: 1, overflowY: "auto", padding: "6px 12px 20px", WebkitOverflowScrolling: "touch" },
      card:             { background: "#111", border: "1px solid #1a1a1a", borderRadius: 8, marginBottom: 6, overflow: "hidden" },
      cardHeader:       { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px" },
      cardName:         { flex: 1, fontSize: 12, color: "#e0e0e0", cursor: "pointer", display: "flex", flexDirection: "column", gap: 2 },
      categoryLabel:    { fontSize: 8, color: "#555", letterSpacing: 2, paddingLeft: 16 },
      chevron:          { color: "#444", fontSize: 10, minWidth: 10 },
      cardActions:      { display: "flex", gap: 6, alignItems: "center" },
      logBtn:           { background: "#1a1100", border: "1px solid #f97316", borderRadius: 6, color: "#f97316", fontSize: 10, fontWeight: 700, padding: "4px 8px", cursor: "pointer", fontFamily: "'DM Mono',monospace", letterSpacing: 1 },
      delBtn:           { background: "transparent", border: "none", color: "#854444", cursor: "pointer", fontSize: 11, padding: "2px 4px" },
      timedPill:        { fontSize: 8, color: "#f97316", background: "#1a1100", border: "1px solid #f9731630", padding: "1px 5px", borderRadius: 4, letterSpacing: 1 },
      rangeGrid:        { borderTop: "1px solid #161616", padding: "8px 12px 10px" },
      rangeHeaderRow:   { display: "flex", marginBottom: 4 },
      personCol:        { width: 42, fontSize: 9, color: "#555", letterSpacing: 1, flexShrink: 0 },
      rangeColHeader:   { flex: 1, fontSize: 9, color: "#555", letterSpacing: 1, textAlign: "center" },
      rangeRow:         { display: "flex", alignItems: "center", marginBottom: 3 },
      rangeCell:        { flex: 1, fontSize: 10, color: "#444", textAlign: "center", padding: "3px 2px", borderRadius: 4 },
      rangeCellFilled:  { color: "#ccc", background: "#161616" },
      dash:             { color: "#2a2a2a" },
      history:          { borderTop: "1px solid #161616", padding: "10px 12px" },
      historyTitle:     { fontSize: 9, color: "#444", letterSpacing: 2, marginBottom: 8 },
      historyRow:       { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8, gap: 8 },
      historyLeft:      { flex: 1 },
      historyDate:      { fontSize: 9, color: "#444", marginBottom: 2 },
      historyMeta:      { display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" },
      historyPerson:    { fontSize: 10, color: "#f97316" },
      historyRange:     { fontSize: 10, color: "#555", background: "#161616", padding: "2px 6px", borderRadius: 4 },
      historyResult:    { fontSize: 11, color: "#ccc", fontWeight: 700 },
      historyNote:      { fontSize: 10, color: "#555", fontStyle: "italic", marginTop: 2 },
      histDelBtn:       { background: "transparent", border: "none", color: "#333", cursor: "pointer", fontSize: 11, padding: "2px 6px", flexShrink: 0 },
      noHistory:        { fontSize: 11, color: "#333", textAlign: "center", padding: "8px 0" },
      noResults:        { padding: 32, textAlign: "center", color: "#333", fontSize: 12 },
      formWrap:         { padding: 16, display: "flex", flexDirection: "column", gap: 10, overflowY: "auto", flex: 1, WebkitOverflowScrolling: "touch" },
      logExName:        { fontSize: 14, fontWeight: 700, color: "#e0e0e0", letterSpacing: 1 },
      timedBadge:       { fontSize: 9, color: "#f97316", background: "#1a1100", border: "1px solid #f9731640", padding: "2px 6px", borderRadius: 4, letterSpacing: 1 },
      whoLabel:         { fontSize: 9, color: "#444", letterSpacing: 2 },
      segmented:        { display: "flex", border: "1px solid #1e1e1e", borderRadius: 8, overflow: "hidden" },
      segBtn:           { flex: 1, padding: 10, background: "#111", border: "none", color: "#555", cursor: "pointer", fontFamily: "'DM Mono',monospace", fontSize: 12, letterSpacing: 1 },
      segActive:        { background: "#1a1100", color: "#f97316" },
      setsLogged:       { background: "#0e0e0e", border: "1px solid #1a1a1a", borderRadius: 7, padding: "8px 10px" },
      setsLoggedTitle:  { fontSize: 9, color: "#444", letterSpacing: 2, marginBottom: 6 },
      setRow:           { display: "flex", gap: 8, alignItems: "center", marginBottom: 3 },
      setNum:           { fontSize: 9, color: "#444", minWidth: 30 },
      setPerson:        { fontSize: 10, color: "#f97316", minWidth: 36 },
      setRange:         { fontSize: 10, color: "#555", background: "#1a1a1a", padding: "1px 5px", borderRadius: 4 },
      setResult:        { fontSize: 11, color: "#ccc", fontWeight: 700 },
      personBlock:      { background: "#0e0e0e", border: "1px solid #1a1a1a", borderRadius: 8, padding: "10px 12px" },
      personBlockLabel: { fontSize: 10, color: "#f97316", fontWeight: 700, letterSpacing: 2, marginBottom: 8 },
      inlineRow:        { display: "flex", gap: 10 },
      inlineField:      { flex: 1, display: "flex", flexDirection: "column", gap: 4 },
      label:            { fontSize: 9, color: "#444", letterSpacing: 2 },
      input:            { padding: "9px 10px", background: "#111", border: "1px solid #1e1e1e", borderRadius: 7, color: "#ddd", fontSize: 12, fontFamily: "'DM Mono',monospace", outline: "none", width: "100%" },
      rangeTag:         { fontSize: 10, color: "#f97316", letterSpacing: 1 },
      bestTag:          { fontSize: 9, color: "#555", letterSpacing: 1 },
      error:            { fontSize: 11, color: "#ef4444", letterSpacing: 1 },
      logBtnRow:        { display: "flex", gap: 10 },
      saveSetBtn:       { flex: 2, padding: 12, background: "#f97316", border: "none", borderRadius: 8, color: "#000", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "'DM Mono',monospace", letterSpacing: 1 },
      doneBtn:          { flex: 1, padding: 12, background: "#1a1a1a", border: "1px solid #333", borderRadius: 8, color: "#aaa", fontSize: 12, cursor: "pointer", fontFamily: "'DM Mono',monospace" },
      submitBtn:        { marginTop: 6, padding: 12, background: "#f97316", border: "none", borderRadius: 8, color: "#000", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "'DM Mono',monospace", letterSpacing: 1 },
      timedNote:        { fontSize: 10, color: "#555", lineHeight: 1.6, background: "#0e0e0e", padding: "8px 10px", borderRadius: 7, border: "1px solid #1a1a1a" },
      sectionLabel:     { fontSize: 9, color: "#555", letterSpacing: 3 },
      settingsNote:     { fontSize: 10, color: "#444", lineHeight: 1.6, fontStyle: "italic" },
      personListRow:    { display: "flex", alignItems: "center", justifyContent: "space-between", background: "#0e0e0e", border: "1px solid #1a1a1a", borderRadius: 8, padding: "10px 14px" },
      personListName:   { fontSize: 13, color: "#e0e0e0", letterSpacing: 1 },
      personRemoveBtn:  { background: "transparent", border: "none", color: "#444", cursor: "pointer", fontSize: 14, padding: "2px 6px" },
      addPersonRow:     { display: "flex", gap: 8 },
      addPersonBtn:     { padding: "9px 14px", background: "#f97316", border: "none", borderRadius: 7, color: "#000", fontWeight: 700, fontSize: 11, cursor: "pointer", fontFamily: "'DM Mono',monospace", letterSpacing: 1, flexShrink: 0 },
      syncBtn:          { padding: 12, background: "#0a1a0a", border: "1px solid #22c55e", borderRadius: 8, color: "#22c55e", fontWeight: 700, fontSize: 11, cursor: "pointer", fontFamily: "'DM Mono',monospace", letterSpacing: 2, width: "100%" },
      syncBtnDisabled:  { opacity: 0.5, cursor: "default" },
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<WorkoutTracker />);
  </script>
</body>

</html>
